form="translate(442 242)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/practicality/#rising-scourge" data-sub="3" aria-label="Одно к одному"><title>Одно к одному</title><g transform="translate(140 371)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="healthy-appetite" style="--d:0"><h3>Здоровый аппетит<small>Healthy Appetite</small></h3><ol class="db-ranks"><li>Пища восстанавливает на 10% больше здоровья.</li><li>Пища восстанавливает на 20% больше здоровья.</li><li>Пища восстанавливает на 30% больше здоровья.</li></ol></section><section class="db-tal" id="rejuvenation" style="--d:1"><h3>Омоложение<small>Rejuvenation</small></h3><p class="db-note">после «Здоровый аппетит»</p><ol class="db-ranks"><li><span class="dbk">Получаемое лечение</span> увеличивается на 10%.</li><li><span class="dbk">Получаемое лечение</span> увеличивается на 15%.</li><li><span class="dbk">Получаемое лечение</span> увеличивается на 20%.</li></ol></section><section class="db-tal" id="all-mothers-blessings" style="--d:2"><h3>Благословение Праматери<small>All-Mother’s Blessings</small></h3><p class="db-note">после «Омоложение»</p><p>Отдых дает вам случайно выбранное благословение, увеличивающее одну из ваших характеристик.</p></section><section class="db-tal" id="unnatural-resilience" style="--d:3"><h3>Нечеловеческая устойчивость<small>Unnatural Resilience</small></h3><p class="db-note">после «Благословение Праматери»</p><p><span class="dbk">Макс. здоровье</span> увеличивается на 5%.</p></section><section class="db-tal" id="revengeful-restoration" style="--d:1"><h3>Мстительное исцеление<small>Revengeful Restoration</small></h3><p class="db-note">после «Здоровый аппетит»</p><p>В течение 2 с после получения урона ваш следующий удар исцелит вас на 5% от макс. здоровья.</p></section><section class="db-tal" id="mercantile-skills" style="--d:0"><h3>Торговые навыки<small>Mercantile Skills</small></h3><ol class="db-ranks"><li>Вы продаете предметы на 20% дороже.</li><li>Вы продаете предметы на 30% дороже.</li><li>Вы продаете предметы на 40% дороже.</li><li>Вы продаете предметы на 50% дороже.</li></ol></section><section class="db-tal" id="side-dish-mastery" style="--d:1"><h3>Приготовление гарниров<small>Side Dish Mastery</small></h3><p class="db-note">после «Торговые навыки»</p><ol class="db-ranks"><li>При приготовлении еды вы с шансом 10% создаете дополнительное блюдо.</li><li>При приготовлении еды вы с шансом 20% создаете дополнительное блюдо.</li><li>При приготовлении еды вы с шансом 30% создаете дополнительное блюдо.</li></ol></section><section class="db-tal" id="additional-herbs-and-spices" style="--d:2"><h3>Дополнительные травы и специи<small>Additional Herbs and Spices</small></h3><p class="db-note">после «Приготовление гарниров»</p><p>Эффекты особых блюд усиливаются на 50%.</p></section><section class="db-tal" id="the-fanatic" style="--d:1"><h3>Ни хвоста, ни чешуи<small>The Fanatic</small></h3><p class="db-note">после «Торговые навыки»</p><p>Удочки на 30% более прочные.</p></section><section class="db-tal" id="not-a-small-fry" style="--d:2"><h3>Не мелкая рыбешка<small>Not a Small Fry</small></h3><p class="db-note">после «Ни хвоста, ни чешуи»</p><p>Во время рыбалки вы с большей вероятностью поймаете крупную рыбу.</p></section><section class="db-tal" id="reusable-resources" style="--d:1"><h3>Многократные ресурсы<small>Reusable Resources</small></h3><p class="db-note">после «Торговые навыки»</p><p>При создании предметов вы с шансом 50% возвращаете один ресурс.</p></section><section class="db-tal" id="crafty" style="--d:2"><h3>Сноровка<small>Crafty</small></h3><p class="db-note">после «Многократные ресурсы»</p><p>Вы можете делать у костра стрелы.</p></section><section class="db-tal" id="mobile-blacksmith" style="--d:3"><h3>Мобильный кузнец<small>Mobile Blacksmith</small></h3><p class="db-note">после «Сноровка»</p><p>Вы можете делать у костра оружие и броню.</p></section><section class="db-tal" id="lightweight-alloys" style="--d:4"><h3>Легкие сплавы<small>Lightweight Alloys</small></h3><p class="db-note">после «Мобильный кузнец»</p><p>У изготовленных предметов вес уменьшается на 1 уровень.</p></section><section class="db-tal" id="master-craftsman" style="--d:4"><h3>Мастер-ремесленник<small>Master Craftsman</small></h3><p class="db-note">после «Мобильный кузнец»</p><p>Вы больше не создаете слабые предметы.</p></section><section class="db-tal" id="optimization-methods" style="--d:1"><h3>Методы оптимизации<small>Optimization Methods</small></h3><p class="db-note">после «Торговые навыки»</p><p>На зелья вам требуется на 50% меньше алкоголя.</p></section><section class="db-tal" id="imbibed-by-the-alchemy" style="--d:2"><h3>Насыщение алхимией<small>Imbibed by the Alchemy</small></h3><p class="db-note">после «Методы оптимизации»</p><p>Зелья действуют на вас в два раза дольше.</p></section><section class="db-tal" id="ethereal-fuel" style="--d:2"><h3>Бесплотное топливо<small>Ethereal Fuel</small></h3><p class="db-note">после «Методы оптимизации»</p><p>Расход бесплотной паутины на насыщение костра снижается на 50%.</p></section><section class="db-tal" id="born-in-armor" style="--d:0"><h3>Рожденный в броне<small>Born in Armor</small></h3><ol class="db-ranks"><li>Показатель «<span class="dbk">Броня</span>» вашего снаряжения увеличивается на 2%.</li><li>Показатель «<span class="dbk">Броня</span>» вашего снаряжения увеличивается на 4%.</li><li>Показатель «<span class="dbk">Броня</span>» вашего снаряжения увеличивается на 6%.</li><li>Показатель «<span class="dbk">Броня</span>» вашего снаряжения увеличивается на 8%.</li></ol></section><section class="db-tal" id="endurance-training" style="--d:1"><h3>Тренировка стойкости<small>Endurance Training</small></h3><p class="db-note">после «Рожденный в броне»</p><ol class="db-ranks"><li>Увел
