use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/perception/#critical-aegis" data-sub="2" aria-label="Эгида критического удара"><title>Эгида критического удара</title><g transform="translate(465 -4)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/perception/#bloodthirst" data-sub="2" aria-label="Жажда крови"><title>Жажда крови</title><g transform="translate(371 83)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/perception/#swift-and-fierce" data-sub="2" aria-label="Быстро и яростно"><title>Быстро и яростно</title><g transform="translate(577 107)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="silent-hunter" style="--d:0"><h3>Бесшумный охотник<small>Silent Hunter</small></h3><ol class="db-ranks"><li><span class="dbk">Шум</span> уменьшается на 20%.</li><li><span class="dbk">Шум</span> уменьшается на 40%.</li><li><span class="dbk">Шум</span> уменьшается на 60%.</li></ol></section><section class="db-tal" id="cheaters-gambit" style="--d:1"><h3>Гамбит обманщика<small>Cheater’s Gambit</small></h3><p class="db-note">после «Бесшумный охотник»</p><p>Атаки против <span class="dbk">ослепленных</span> врагов всегда приводят к <span class="dbk">критическим попаданиям</span>.</p></section><section class="db-tal" id="assassins-doctrine" style="--d:1"><h3>Доктрина ассасина<small>Assassin’s Doctrine</small></h3><p class="db-note">после «Бесшумный охотник»</p><ol class="db-ranks"><li><span class="dbk">Урон исподтишка</span> увеличивается на 50%.</li><li><span class="dbk">Урон исподтишка</span> увеличивается на 85%.</li></ol></section><section class="db-tal" id="ambushers-impact" style="--d:2"><h3>Удар из засады<small>Ambusher’s Impact</small></h3><p class="db-note">после «Доктрина ассасина»</p><p>Атака исподтишка <span class="dbk">оглушает</span> врагов.</p></section><section class="db-tal" id="wolf-among-sheep" style="--d:2"><h3>Волк среди овец<small>Wolf Among Sheep</small></h3><p class="db-note">после «Доктрина ассасина»</p><ol class="db-ranks"><li>За каждого врага в радиусе 15 м, не участвующего в бою, <span class="dbk">Урон исподтишка</span> увеличивается на 15%.</li><li>За каждого врага в радиусе 15 м, не участвующего в бою, <span class="dbk">Урон исподтишка</span> увеличивается на 25%.</li><li>За каждого врага в радиусе 15 м, не участвующего в бою, <span class="dbk">Урон исподтишка</span> увеличивается на 35%.</li></ol></section><section class="db-tal" id="cheat-death" style="--d:1"><h3>Обман смерти<small>Cheat Death</small></h3><p class="db-note">после «Бесшумный охотник»</p><p>При получении смертельного урона вы не умираете, а получаете невидимость на 5 c. Срабатывает не чаще раза в 240 c.</p></section><section class="db-tal" id="dagger-proficiency" style="--d:0"><h3>Мастерство кинжала<small>Dagger Proficiency</small></h3><ol class="db-ranks"><li>Удары кинжалами в спину имеют увеличенный на 33% шанс стать <span class="dbk">критическими попаданиями</span>.</li><li>Удары кинжалами в спину имеют увеличенный на 66% шанс стать <span class="dbk">критическими попаданиями</span>.</li><li>Удары кинжалами в спину имеют увеличенный на 100% шанс стать <span class="dbk">критическими попаданиями</span>.</li></ol></section><section class="db-tal" id="lingering-afflictions" style="--d:1"><h3>Затяжная болезнь<small>Lingering Afflictions</small></h3><p class="db-note">после «Мастерство кинжала»</p><p>Кинжалы ускоряют <span class="dbk">накопление</span> состояний на x10.</p></section><section class="db-tal" id="razors-edge" style="--d:2"><h3>Лезвие бритвы<small>Razor’s Edge</small></h3><p class="db-note">после «Затяжная болезнь»</p><ol class="db-ranks"><li>При каждой атаке кинжалы с шансом 20% вызывают у цели <span class="dbk">кровотечение</span>.</li><li>При каждой атаке кинжалы с шансом 30% вызывают у цели <span class="dbk">кровотечение</span>.</li><li>При каждой атаке кинжалы с шансом 40% вызывают у цели <span class="dbk">кровотечение</span>.</li><li>При каждой атаке кинжалы с шансом 50% вызывают у цели <span class="dbk">кровотечение</span>.</li></ol></section><section class="db-tal" id="deadly-remedy" style="--d:2"><h3>Смертельное средство<small>Deadly Remedy</small></h3><p class="db-note">после «Затяжная болезнь»</p><p>Тяжелые атаки кинжалами снимают с противника <span class="dbk">отравление</span> и <span class="dbk">кровотечение</span>, мгновенно нанося 80% от их оставшегося урона.</p></section><section class="db-tal" id="claws-of-the-predator" style="--d:1"><h3>Когти хищника<small>Claws of the Predator</small></h3><p class="db-note">после «Мастерство кинжала»</p><ol class="db-ranks"><li>При ударе в спину <span class="dbk">Выносливость</span> цели снижается на 40%.</li><li>При ударе в спину <span class="dbk">Выносливость</span> цели снижается на 80%.</li></ol></section><section class="db-tal" id="deadly-luck" style="--d:2"><h3>Смертоносная удача<small>Deadly Luck</small></h3><p class="db-note">после «Когти хищника»</p><ol class="db-ranks"><li><span class="dbk">Урон от удара в спину</span> увеличивается на 100% за каждый экипированный кинжал.</li><li><span class="dbk">Урон от удара в спину</span> увеличивается на 2 за каждый экипированный кинжал.</li><li><span class="dbk">Урон от удара в спину</span> увеличивается на 3 за каждый экипированный кинжал.</li></ol></section><section class="db-tal" id="serpents-swiftness" style="--d:1"><h3>Стремительность змеи<small>Serpent’s Swiftness</small></h3><p class="db-note">после «Мастерство кинжала»</p><ol class="db-ranks"><li>Если вы вооружены кинжалом, <span class="dbk">Скорость атаки</span> увеличивается на 7%.</li><li>Если вы вооружены кинжалом, <span class="dbk">Скорость атаки</span> увеличивается на 14%.</li><li>Если вы вооружены кинжалом, <span class="dbk">Скорость атаки</span> увеличивается на 21%.</li></ol></section><section class="db-tal" id="predators-fangs" style="--d:2"><h3>Клыки хищника<small>Predator’s Fangs</small></h3><p class="db-note">после «Стремительность змеи»</p><ol class="db-ranks"><li>Если вы вооружены кинжалом, <span class="dbk">Критический урон</span> увеличивается на 30%.</li><li>Если вы вооружены кинжалом, <span class="dbk">Критический урон</span> увеличивается на 50%.</li></ol></section><section class="db-tal" id="extra-lucky" style="--d:0"><h3>Особая удача<small>Extra Lucky</small></h3><ol class="db-ranks"><li><span class="dbk">Шанс крит. урона</span> увеличивается на 2%.</li><li><span class="dbk">Шанс крит. урона</span> увеличивается на 4%.</li><li><span class="dbk">Шанс крит. урона</span> увеличивается на 6%.</li></ol></section><section class="db-tal" id="critical-cascade" style="--d:1"><h3>Критический каскад<small>Critical Cascade</small></h3><p class="db-note">после «Особая удача»</p><p>Каждый <span class="dbk">последовательный удар</span> увеличивает шанс <span class="dbk">критического попадания</span> на 2%, вплоть до 2%.</p></section><section class="db-tal" id="go-for-the-eyes" style="--d:2"><h3>Головорез<small>Go for the Eyes</small></h3><p class="db-note">после «Критический каскад»</p><ol class="db-ranks"><li><span class="dbk">Критический урон</span> увеличивается на 10%.</li><li><span class="dbk">Критический урон</span> увеличивается на 20%.</li><li><span class="dbk">Критический урон</span> увеличивается на 30%.</li><li><span class="dbk">Критический урон</span> увеличивается на 40%.</li></ol></section><section class="db-tal" id="respite-in-cruelty" style="--d:1"><h3>Жестокая передышка<small>Respite in Cruelty</small></h3><p class="db-note">после «Особая удача»</p><ol class="db-ranks"><li>При <span class="dbk">критическом попадании</span> у вас с шансом 20% полностью восстанавливается <span class="dbk">Выносливость</span>.</li><li>При <span class="dbk">критическом попадании</span> у вас с шансом 30% полностью восстанавливается <span class="dbk">Выносливость</span>.</li><li>При <span class="dbk">критическом попадании</span> у вас с шансом 40% полностью восстанавливается <span class="dbk">Выносливость</span>.</li></ol></section><section class="db-tal" id="deep-wounds" style="--d:2"><h3>Глубокие раны<small>Deep Wounds</small></h3><p class="db-note">после «Жестокая передышка»</p><ol class="db-ranks"><li><span class="dbk">Критическое попадание</span> с шансом 30% вызывает <span class="dbk">кровотечение</span>.</li><li><span class="dbk">Критическое попадание</span> с шансом 40% вызывает <span class="dbk">кровотечение</span>.</li><li><span class="dbk">Критическое попадание</span> с шансом 50% вызывает <span class="dbk">кровотечение</span>.</li></ol></section><section class="db-tal" id="critical-aegis" style="--d:2"><h3>Эгида критического удара<small>Critical Aegis</small></h3><p class="db-note">после «Жестокая передышка»</p><ol class="db-ranks"><li>С каждым <span class="dbk">критическим попаданием</span> вы получаете <span class="dbq" title="значение зависит от уровня">?</span> снижения урона против следующего полученного удара.</li><li>С каждым <span class="dbk">критическим попаданием</span> вы получаете <span class="dbq" title="значение зависит от уровня">?</span> снижения урона против следующего полученного удара.</li></ol></section><section class="db-tal" id="bloodthirst" style="--d:3"><h3>Жажда крови<small>Bloodthirst</small></h3><p class="db-note">после «Эгида критического удара»</p><ol class="db-ranks"><li><span class="dbk">Критические попадания</span> исцеляют вас на 2% от нанесенного урона.</li><li><span class="dbk">Критические попадания</span> исцеляют вас на 4% от нанесенного урона.</li></ol></section><section class="db-tal" id="swift-and-fierce" style="--d:3"><h3>Быстро и яростно<small>Swift and Fierce</small></h3><p class="db-note">после «Эгида критического удара»</p><ol class="db-ranks"><li><span class="dbk">Критические попадания</span> увеличивают вашу скорость движения на 20% на 5 c.</li><li><span class="dbk">Критические попадания</span> увеличивают вашу скорость движения на 20% на 10 c.</li></ol></section></template>
