ht="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/sarras/#strong-resolve" data-sub="2" aria-label="Сильная воля"><title>Сильная воля</title><g transform="translate(-585 -46)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/sarras/#crushing-impact" data-sub="2" aria-label="Сокрушительное столкновение"><title>Сокрушительное столкновение</title><g transform="translate(-502 36)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="mana-spring" style="--d:0"><h3>Источник маны<small>Mana Spring</small></h3><p>Восстанавливает 2% последнего нанесенного урона в виде маны в течение 6 с.</p></section><section class="db-tal" id="melee-macabre" style="--d:1"><h3>Ближний разбой<small>Melee Macabre</small></h3><p class="db-note">после «Источник маны»</p><p><span class="dbk">Сила</span> вызванных вами существ возрастает на 2% при каждом вашем <span class="dbk">последовательном попадании</span>.</p></section><section class="db-tal" id="allies-together-strong" style="--d:2"><h3>Союзная мощь<small>Allies Together Strong</small></h3><p class="db-note">после «Ближний разбой»</p><p>Ваш урон и урон всех ваших союзников увеличивается на 5% за каждого союзника в бою.</p></section><section class="db-tal" id="parting-gift" style="--d:2"><h3>Прощальный дар<small>Parting Gift</small></h3><p class="db-note">после «Ближний разбой»</p><p>После гибели вызванных вами существ от них остается эссенция маны. Вы можете подобрать ее, и <span class="dbk">Мана</span> восстановится на 30.</p></section><section class="db-tal" id="summoners-curse" style="--d:3"><h3>Проклятье Призывателя<small>Summoner’s Curse</small></h3><p class="db-note">после «Прощальный дар»</p><p>Вызванные вами существа накладывают проклятье на врага, который их убивает, и наносят ему 400% своего урона атаки на протяжении 8 с.</p></section><section class="db-tal" id="ebb-and-flow" style="--d:1"><h3>Прилив и отлив<small>Ebb and Flow</small></h3><p class="db-note">после «Источник маны»</p><p>Заклинания, наносящие урон по площади, наносят +20% урона.<br>Заклинания, не наносящие урон по площади, накладывают <span class="dbk">уровень немощи</span> на пораженных врагов.</p></section><section class="db-tal" id="overcasting" style="--d:2"><h3>Пере-заклинание<small>Overcasting</small></h3><p class="db-note">после «Прилив и отлив»</p><p>Если полностью заряженное заклинание удерживается не менее 4 с, его базовый максимальный урон возрастает до 40%.</p></section><section class="db-tal" id="elemental-exposure" style="--d:2"><h3>Стихийный наплыв<small>Elemental Exposure</small></h3><p class="db-note">после «Прилив и отлив»</p><p>Каждый <span class="dbk">уровень немощи</span>, наложенный на врага, повышает скорость накладывания на него стихийных состояний вплоть до 50%.</p></section><section class="db-tal" id="elemental-crescendo" style="--d:3"><h3>Крещендо стихий<small>Elemental Crescendo</small></h3><p class="db-note">после «Стихийный наплыв»</p><p>Если враг умирает с <span class="dbk">ожогом</span>, <span class="dbk">отравлением</span>, <span class="dbk">обморожением</span> или <span class="dbk">заморозкой</span>, он взрывается и передает врагам поблизости свое стихийное состояние.</p></section><section class="db-tal" id="viral-elements" style="--d:3"><h3>Вирусные стихии<small>Viral Elements</small></h3><p class="db-note">после «Стихийный наплыв»</p><p>Враги с активным стихийным состоянием передают его другим врагам в радиусе 4 м.</p></section><section class="db-tal" id="recovery-focus" style="--d:1"><h3>Точка исцеления<small>Recovery Focus</small></h3><p class="db-note">после «Источник маны»</p><p>Если у вас снаряжен жезл, куб души, щит или оружие ближнего боя, <span class="dbk">Восстановление маны</span> возрастает на 20%.</p></section><section class="db-tal" id="arcane-smite" style="--d:2"><h3>Магический разнос<small>Arcane Smite</small></h3><p class="db-note">после «Точка исцеления»</p><p>Атаки ближнего боя получают магическое усиление и наносят дополнительно 50% урона от вашего параметра «<span class="dbk">Мощь заклинаний</span>», однако на это тратится <span class="dbk">Мана</span> в размере 2 от расхода выносливости.</p></section><section class="db-tal" id="relic-hunter" style="--d:2"><h3>Охотник за реликвиями<small>Relic Hunter</small></h3><p class="db-note">после «Точка исцеления»</p><p>Каждая реликвия, вставленная в снаряженные вами предметы экипировки, повышает параметр «<span class="dbk">Мощь заклинаний</span>» на 7%, а параметр «<span class="dbk">Макс. мана</span>» – на 2%.</p></section><section class="db-tal" id="infinity-cubes" style="--d:3"><h3>Кубики бесконечности<small>Infinity Cubes</small></h3><p class="db-note">после «Охотник за реликвиями»</p><p>При активации куба души <span class="dbk">Расход маны</span> уменьшается на 50% на 6 c.</p></section><section class="db-tal" id="battlemage" style="--d:3"><h3>Боевой маг<small>Battlemage</small></h3><p class="db-note">после «Охотник за реликвиями»</p><p>Оружие ближнего боя и щиты считаются жезлами.</p></section><section class="db-tal" id="frailty-broker" style="--d:0"><h3>Даритель немощи<small>Frailty Broker</small></h3><p>При нанесении урона врагу он получает <span class="dbk">уровень немощи</span>.<br>Тяжелые атаки и <span class="dbk">удары в слабые места</span> накладывают дополнительный <span class="dbk">уровень немощи</span>.</p></section><section class="db-tal" id="frailty-expert" style="--d:1"><h3>Эксперт по немощи<small>Frailty Expert</small></h3><p class="db-note">после «Даритель немощи»</p><p><span class="dbk">Критические попадания</span> накладывают дополнительный <span class="dbk">уровень немощи</span>.</p></section><section class="db-tal" id="skirmisher-charge" style="--d:2"><h3>Налет застрельщика<small>Skirmisher Charge</small></h3><p class="db-note">после «Эксперт по немощи»</p><p><span class="dbk">Скорость атаки</span> возрастает на 35% на 4 с при нанесении урона оружием дальнего боя.</p></section><section class="db-tal" id="skirmisher-retreat" style="--d:2"><h3>Отступление застрельщика<small>Skirmisher Retreat</small></h3><p class="db-note">после «Эксперт по немощи»</p><p><span class="dbk">Шанс крит. урона в дальнем бою</span> возрастает на 7% на 4 с при нанесении урона оружием ближнего боя.</p></section><section class="db-tal" id="chink-in-the-armor" style="--d:2"><h3>Щель в броне<small>Chink in the Armor</small></h3><p class="db-note">после «Эксперт по немощи»</p><p>Когда вы толкаете врага, это поглощает все его <span class="dbk">уровни немощи</span> и <span class="dbk">ломает броню врага</span> на срок до 15 с, в зависимости от поглощенных уровней.</p></section><section class="db-tal" id="riposte" style="--d:3"><h3>Контрудар<small>Riposte</small></h3><p class="db-note">после «Щель в броне»</p><p>Успешное уклонение от атаки с помощью рывка увеличивает параметр «<span class="dbk">Шанс крит. урона</span>» на 10% на 8 с.</p></section><section class="db-tal" id="dependable-luck" style="--d:1"><h3>Надежная удача<small>Dependable Luck</small></h3><p class="db-note">после «Даритель немощи»</p><p>Каждое не-<span class="dbk">критическое попадание</span> увеличивает параметр «<span class="dbk">Шанс крит. урона</span>» на 5%.<br>Эффект обнуляется после <span class="dbk">критического попадания</span>.</p></section><section class="db-tal" id="death-from-nowhere" style="--d:2"><h3>Смерть из ниоткуда<small>Death From Nowhere</small></h3><p class="db-note">после «Надежная удача»</p><p><span class="dbk">Урон исподтишка</span> увеличивается на 50%.<br>Убийства, совершенные исподтишка, увеличивают параметр «<span class="dbk">Урон исподтишка</span>» еще на 50% на 0.5 с.</p></section><section class="db-tal" id="perfect-draw" style="--d:2"><h3>Идеальный выпад<small>Perfect Draw</small></h3><p class="db-note">после «Надежная удача»</p><p>Если вы выпускаете стрелу в течение 0.4 с после полного натягивания лука, выстрел считается идеальным и базовый урон стрелы возрастает на 65%.</p></section><section class="db-tal" id="speed-demon" style="--d:3"><h3>Демон скорости<small>Speed Demon</small></h3><p class="db-note">после «Идеальный выпад»</p><p>Каждый <span class="dbk">уровень немощи</span> на врагах поблизости увеличивает ваш параметр «<span class="dbk">Скорость атаки</span>» на 1%, а параметр «<span class="dbk">Скорость натяжения лука</span>» – на 1%.</p></section><section class="db-tal" id="perfect-pierce" style="--d:3"><h3>Идеальное пронзание<small>Perfect Pierce</small></h3><p class="db-note">после «Идеальный выпад»</p><p>Идеально выпущенная стрела пронзает дополнительно 1 врага.<br>Урон, наносимый стрелами, увеличивается на 100% за каждого пронзенного врага.</p></section><section class="db-tal" id="rising-exhaustion" style="--d:1"><h3>Растущее утомление<small>Rising Exhaustion</small></h3><p class="db-note">после «Даритель немощи»</p><p>Когда вы наносите урон врагу, его параметр «<span class="dbk">Выносливость</span>» понижается, до 10% от нанесенного урона – в зависимости от текущих <span class="dbk">уровней немощи</span>.</p></section><section class="db-tal" id="coup-de-gr-ce" style="--d:2"><h3>Удар милосердия<small>Coup de Grâce</small></h3><p class="db-note">после «Растущее утомление»</p><p>Если противнику (не боссу) наносится урон, когда он <span class="dbk">ошеломлен</span> и его параметр «<span class="dbk">Макс. здоровье</span>» ниже 33%, это мгновенно его убивает.</p></section><section class="db-tal" id="wrecking-ball" style="--d:2"><h3>Шаровой таран<small>Wrecking Ball</small></h3><p class="db-note">после «Растущее утомление»</p><p>Избыточный урон от добивающего удара прибавляется к следующему урону, нанесенному вами в течение 10 с.</p></section><section class="db-tal" id="less-waste" style="--d:3"><h3>Меньше отходов<small>Less Waste</small></h3><p class="db-note">после «Шаровой таран»</p><p>Когда вы убиваете врага, на которого была наложена <span class="dbk">немощь</span>, 50% этого эффекта переходит на ближайшего к нему врага.</p></section><section class="db-tal" id="instinct-of-a-killer" style="--d:3"><h3>Инстинкт убийцы<small>Instinct of a Killer</small></h3><p class="db-note">после «Шаровой таран»</p><p>Если противнику (не боссу) наносится урон выше <span class="dbq" title="значение зависит от уровня">?</span> от его текущего параметра «<span class="dbk">Здоровье</span>», это мгновенно его убивает.</p></section><section class="db-tal" id="strength-in-numbers" style="--d:0"><h3>Вместе мы — сила<small>Strength In Numbers</small></h3><p>За каждого врага в радиусе 6 м <span class="dbk">Сила</span> увеличивается на 10%.</p></section><section class="db-tal" id="menace-of-the-weary" style="--d:1"><h3>Угроза усталости<small>Menace of the Weary</small></h3><p class="db-note">после «Вместе мы — сила»</p><p>Враги получают дополнительный урон, до 33%, из расчета недостачи параметра «<span class="dbk">Выносливость</span>».<br>Для <span class="dbk">ошеломленных</span> врагов недостача параметра «<span class="dbk">Выносливость</span>» считается равной 100%.</p></section><section class="db-tal" id="deadly-rejuvenation" style="--d:2"><h3>Смертельное омоложение<small>Deadly Rejuvenation</small></h3><p class="db-note">после «Угроза усталости»</p><p>Убийство врага понижает расход выносливости на вашу следующую атаку, нанесенную в течение 4 с, на 100%.</p></section><section class="db-tal" id="the-heaviest-of-attacks" style="--d:2"><h3>Мощнейшая атака<small>The Heaviest of Attacks</small></h3><p class="db-note">после «Угроза усталости»</p><p>Если тяжелая атака удерживается не менее 3 с, наносимый ею урон возрастает до 100%.</p></section><section class="db-tal" id="juggernaut" style="--d:3"><h3>Сокрушитель<small>Juggernaut</small></h3><p class="db-note">после «Мощнейшая атака»</p><p>Урон, получаемый в ближнем бою во время ваших собственных атак ближнего боя, снижается на 33%.</p></section><section class="db-tal" id="flooding-force" style="--d:3"><h3>Неукротимый поток<small>Flooding Force</small></h3><p class="db-note">после «Мощнейшая атака»</p><p>Ближайшие враги получают 50% урона, нанесенного <span class="dbk">критическим попаданием</span>.</p></section><section class="db-tal" id="desire-for-speed" style="--d:1"><h3>Жажда скорости<small>Desire For Speed</small></h3><p class="db-note">после «Вместе мы — сила»</p><p>За каждого врага в радиусе 6 м <span class="dbk">Скорость атаки</span> увеличивается на 8%.</p></section><section class="db-tal" id="useful-overload" style="--d:2"><h3>Полезная перегрузка<small>Useful Overload</small></h3><p class="db-note">после «Жажда скорости»</p><p>Максимальный урон оружия возрастает на 1 за каждый килограмм веса вашей брони.</p></section><section class="db-tal" id="kickstart" style="--d:2"><h3>Мощный стимул<small>Kickstart</small></h3><p class="db-note">после «Жажда скорости»</p><p><span class="dbk">Скорость атаки</span> увеличивается благодаря тяжелым атакам на 25% на 4 c.</p></section><section class="db-tal" id="death-from-above" style="--d:3"><h3>Смерть с высоты<small>Death From Above</small></h3><p class="db-note">после «Мощный стимул»</p><p>Атаки ближнего боя, совершаемые в прыжке или при падении, всегда становятся <span class="dbk">критическими попаданиями</span>, но ваша скорость атаки и скорость движения после этого снижаются на 50% на 3 с.</p></section><section class="db-tal" id="vicious-gamble" style="--d:3"><h3>Отчаянный риск<small>Vicious Gamble</small></h3><p class="db-note">после «Мощный стимул»</p><p>Максимальный базовый урон оружия ближнего и дальнего боя возрастает на 25%, но минимальный базовый урон снижается на 25%.</p></section><section class="db-tal" id="endurance-fighter" style="--d:1"><h3>Стойкий боец<small>Endurance Fighter</small></h3><p class="db-note">после «Вместе мы — сила»</p><p><span class="dbk">Расход выносливости</span> снижается на 5% за каждого врага в радиусе 6 м.</p></section><section class="db-tal" id="moment-to-breathe" style="--d:2"><h3>Миг передышки<small>Moment to Breathe</small></h3><p class="db-note">после «Стойкий боец»</p><p>Первый полученный урон снижается на 100%, когда вы <span class="dbk">сбиты с ног</span> или страдаете от <span class="dbk">перенапряжения</span>.</p></section><section class="db-tal" id="strong-resolve" style="--d:2"><h3>Сильная воля<small>Strong Resolve</small></h3><p class="db-note">после «Стойкий боец»</p><p>Срок действия всех ослаблений, наложенных на вас, сокращается на 33%.</p></section><section class="db-tal" id="crushing-impact" style="--d:3"><h3>Сокрушительное столкновение<small>Crushing Impact</small></h3><p class="db-note">после «Сильная воля»</p><p>Толчок наносит 50% урона от оружия и <span class="dbk">оглушает</span> всех врагов в радиусе 6 м. Действует не чаще одного раза в 15 с.</p></section></template>
