tle><g transform="translate(-563 -82)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/red-death/#grieve-thy-enemies" data-sub="0" aria-label="Горе по врагам"><title>Горе по врагам</title><g transform="translate(-563 11)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/red-death/#weep-in-success" data-sub="0" aria-label="Плач от успехов"><title>Плач от успехов</title><g transform="translate(-563 205)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/red-death/#seeds-of-sorrow" data-sub="0" aria-label="Зерна печали"><title>Зерна печали</title><g transform="translate(-354 11)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/red-death/#hold-back-tears" data-sub="0" aria-label="Сдержанные слезы"><title>Сдержанные слезы</title><g transform="translate(-377 199)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/red-death/#long-regret" data-sub="0" aria-label="Долгое сожаление"><title>Долгое сожаление</title><g transform="translate(-699 55)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/red-death/#give-in-and-give-up" data-sub="0" aria-label="Отказ от борьбы"><title>Отказ от борьбы</title><g transform="translate(-699 205)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/red-death/#plague-warden" data-sub="1" aria-label="Чумной страж"><title>Чумной страж</title><g transform="translate(602 -118)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/red-death/#red-deaths-embrace" data-sub="1" aria-label="Объятия Красной смерти"><title>Объятия Красной смерти</title><g transform="translate(602 173)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="cry-in-pain" style="--d:0"><h3>Крик боли<small>Cry in Pain</small></h3><ol class="db-ranks"><li>Потеря 1% от макс. здоровья дает уровень скорби.<br>Скорбь: увеличивает наносимый урон на 0.4%.<br>Макс. уровней: <span class="dbk">Макс. здоровье</span>.</li><li>Потеря 1% от макс. здоровья дает уровень скорби.<br>Скорбь: увеличивает наносимый урон на 0.6%.<br>Макс. уровней: <span class="dbk">Макс. здоровье</span>.</li><li>Потеря 1% от макс. здоровья дает уровень скорби.<br>Скорбь: увеличивает наносимый урон на 0.8%.<br>Макс. уровней: <span class="dbk">Макс. здоровье</span>.</li><li>Потеря 1% от макс. здоровья дает уровень скорби.<br>Скорбь: увеличивает наносимый урон на 1%.<br>Макс. уровней: <span class="dbk">Макс. здоровье</span>.</li></ol></section><section class="db-tal" id="grieve-thy-enemies" style="--d:1"><h3>Горе по врагам<small>Grieve Thy Enemies</small></h3><p class="db-note">после «Крик боли»</p><ol class="db-ranks"><li>За убийство противников вы получаете 10 ур. скорби.</li><li>За убийство противников вы получаете 15 ур. скорби.</li><li>За убийство противников вы получаете 20 ур. скорби.</li></ol></section><section class="db-tal" id="weep-in-success" style="--d:2"><h3>Плач от успехов<small>Weep in Success</small></h3><p class="db-note">после «Горе по врагам»</p><ol class="db-ranks"><li>За <span class="dbk">критические попадания</span> вы получаете 2 ур. скорби.</li><li>За <span class="dbk">критические попадания</span> вы получаете 3 ур. скорби.</li><li>За <span class="dbk">критические попадания</span> вы получаете 4 ур. скорби.</li></ol></section><section class="db-tal" id="seeds-of-sorrow" style="--d:2"><h3>Зерна печали<small>Seeds of Sorrow</small></h3><p class="db-note">после «Горе по врагам»</p><ol class="db-ranks"><li>При нанесении урона противнику вы с шансом 25% получаете уровень скорби.</li><li>При нанесении урона противнику вы с шансом 50% получаете уровень скорби.</li><li>При нанесении урона противнику вы с шансом 75% получаете уровень скорби.</li></ol></section><section class="db-tal" id="hold-back-tears" style="--d:2"><h3>Сдержанные слезы<small>Hold Back Tears</small></h3><p class="db-note">после «Горе по врагам»</p><ol class="db-ranks"><li>Вы начинаете каждый бой с 15 ур. скорби.</li><li>Вы начинаете каждый бой с 25 ур. скорби.</li><li>Вы начинаете каждый бой с 35 ур. скорби.</li></ol></section><section class="db-tal" id="long-regret" style="--d:1"><h3>Долгое сожаление<small>Long Regret</small></h3><p class="db-note">после «Крик боли»</p><ol class="db-ranks"><li>На 50% увеличивает задержку перед тем, как начнут пропадать уровни скорби.</li><li>На 100% увеличивает задержку перед тем, как начнут пропадать уровни скорби.</li></ol></section><section class="db-tal" id="give-in-and-give-up" style="--d:2"><h3>Отказ от борьбы<small>Give In and Give Up</small></h3><p class="db-note">после «Долгое сожаление»</p><ol class="db-ranks"><li>Увеличивает максимальное количество уровней скорби на 50.</li><li>Увеличивает максимальное количество уровней скорби на 75.</li><li>Увеличивает максимальное количество уровней скорби на 100.</li></ol></section><section class="db-tal" id="plague-warden" style="--d:0"><h3>Чумной страж<small>Plague Warden</small></h3><ol class="db-ranks"><li>Вы не можете потерять более 50% от макс. здоровья от одного удара.</li><li>Вы не можете потерять более 33% от макс. здоровья от одного удара.</li><li>Вы не можете потерять более 25% от макс. здоровья от одного удара.</li></ol></section><section class="db-tal" id="red-deaths-embrace" style="--d:1"><h3>Объятия Красной смерти<small>Red Death’s Embrace</small></h3><p class="db-note">после «Чумной страж»</p><p>Один раз предотвращает смерть. Перезаряжается после отдыха у насыщенного костра.</p></section></template>
