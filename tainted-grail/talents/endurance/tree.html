><a class="db-tn" href="/db/tainted-grail/talents/endurance/#unstoppable-rage" data-sub="2" aria-label="Неудержимое неистовство"><title>Неудержимое неистовство</title><g transform="translate(425 -108)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/tainted-grail/talents/endurance/#furious-assault" data-sub="2" aria-label="Яростный натиск"><title>Яростный натиск</title><g transform="translate(587 48)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="counterweight" style="--d:0"><h3>Противовес<small>Counterweight</small></h3><ol class="db-ranks"><li>Когда вы используете щит, <span class="dbk">Урон в ближнем бою</span> увеличивается на 10%.</li><li>Когда вы используете щит, <span class="dbk">Урон в ближнем бою</span> увеличивается на 15%.</li><li>Когда вы используете щит, <span class="dbk">Урон в ближнем бою</span> увеличивается на 20%.</li></ol></section><section class="db-tal" id="prepared-block" style="--d:1"><h3>Подготовленный блок<small>Prepared Block</small></h3><p class="db-note">после «Противовес»</p><ol class="db-ranks"><li>На блок требуется на 10% меньше выносливости.</li><li>На блок требуется на 20% меньше выносливости.</li><li>На блок требуется на 30% меньше выносливости.</li></ol></section><section class="db-tal" id="deflecting-block" style="--d:2"><h3>Отражающий блок<small>Deflecting Block</small></h3><p class="db-note">после «Подготовленный блок»</p><p>При блоке ваш щит с вероятностью 100% отражает каждую стрелу и метательный снаряд.</p></section><section class="db-tal" id="spell-syphon" style="--d:2"><h3>Вытягивание заклинаний<small>Spell Syphon</small></h3><p class="db-note">после «Подготовленный блок»</p><ol class="db-ranks"><li>При блокировании заклинаний восстанавливается мана на 20% от заблокированного урона.</li><li>При блокировании заклинаний восстанавливается мана на 30% от заблокированного урона.</li><li>При блокировании заклинаний восстанавливается мана на 40% от заблокированного урона.</li></ol></section><section class="db-tal" id="disrupting-shove" style="--d:1"><h3>Разрушительный напор<small>Disrupting Shove</small></h3><p class="db-note">после «Противовес»</p><ol class="db-ranks"><li>Парирование щитом с шансом 10% <span class="dbk">замедляет</span> атакующего на 2 c.</li><li>Парирование щитом с шансом 15% <span class="dbk">замедляет</span> атакующего на 3 c.</li><li>Парирование щитом с шансом 20% <span class="dbk">замедляет</span> атакующего на 4 c.</li></ol></section><section class="db-tal" id="confidence" style="--d:2"><h3>Уверенность<small>Confidence</small></h3><p class="db-note">после «Разрушительный напор»</p><ol class="db-ranks"><li>Когда у вас есть щит, получаемый урон снижается на 5%.</li><li>Когда у вас есть щит, получаемый урон снижается на 10%.</li><li>Когда у вас есть щит, получаемый урон снижается на 15%.</li></ol></section><section class="db-tal" id="shieldbearer" style="--d:2"><h3>Щитоносец<small>Shieldbearer</small></h3><p class="db-note">после «Разрушительный напор»</p><p>Втрое увеличивает урон, наносимый щитами.</p></section><section class="db-tal" id="frequent-exercise" style="--d:0"><h3>Частые упражнения<small>Frequent Exercise</small></h3><p><span class="dbk">Макс. выносливость</span> увеличивается на 7.</p></section><section class="db-tal" id="determination" style="--d:1"><h3>Целеустремленность<small>Determination</small></h3><p class="db-note">после «Частые упражнения»</p><ol class="db-ranks"><li>При получении урона <span class="dbk">Макс. выносливость</span> мгновенно восстанавливается на 2%.</li><li>При получении урона <span class="dbk">Макс. выносливость</span> мгновенно восстанавливается на 5%.</li></ol></section><section class="db-tal" id="poised-for-impact" style="--d:2"><h3>Готовность к удару<small>Poised for Impact</small></h3><p class="db-note">после «Целеустремленность»</p><p>Когда <span class="dbk">Выносливость</span> полностью восстанавливается, вы получаете на 15% меньше урона.</p></section><section class="db-tal" id="first-blood" style="--d:2"><h3>Первая кровь<small>First Blood</small></h3><p class="db-note">после «Целеустремленность»</p><ol class="db-ranks"><li>Когда у вас <span class="dbk">Выносливость</span> на максимуме, <span class="dbk">Сила</span> возрастает на 10%.</li><li>Когда у вас <span class="dbk">Выносливость</span> на максимуме, <span class="dbk">Сила</span> возрастает на 20%.</li><li>Когда у вас <span class="dbk">Выносливость</span> на максимуме, <span class="dbk">Сила</span> возрастает на 30%.</li></ol></section><section class="db-tal" id="gaining-momentum" style="--d:1"><h3>Растущий импульс<small>Gaining Momentum</small></h3><p class="db-note">после «Частые упражнения»</p><ol class="db-ranks"><li>После убийства врага <span class="dbk">Макс. выносливость</span> мгновенно восстанавливает на 10%.</li><li>После убийства врага <span class="dbk">Макс. выносливость</span> мгновенно восстанавливает на 20%.</li></ol></section><section class="db-tal" id="atone-in-suffering" style="--d:2"><h3>Искупление в страданиях<small>Atone in Suffering</small></h3><p class="db-note">после «Растущий импульс»</p><ol class="db-ranks"><li>При <span class="dbk">перенапряжении</span> вы получаете на 10% меньше урона.</li><li>При <span class="dbk">перенапряжении</span> вы получаете на 20% меньше урона.</li><li>При <span class="dbk">перенапряжении</span> вы получаете на 30% меньше урона.</li></ol></section><section class="db-tal" id="back-into-the-fray" style="--d:2"><h3>Снова в битву<small>Back into the Fray</small></h3><p class="db-note">после «Растущий импульс»</p><p>Восстановление после <span class="dbk">перенапряжения</span> происходит на 50% быстрее.</p></section><section class="db-tal" id="exploit-weakness" style="--d:2"><h3>Удар в слабое место<small>Exploit Weakness</small></h3><p class="db-note">после «Растущий импульс»</p><ol class="db-ranks"><li>После <span class="dbk">ошеломления</span> противника <span class="dbk">Выносливость</span> восстанавливается на 20 ед.</li><li>После <span class="dbk">ошеломления</span> противника <span class="dbk">Выносливость</span> восстанавливается на 30 ед.</li><li>После <span class="dbk">ошеломления</span> противника <span class="dbk">Выносливость</span> восстанавливается на 40 ед.</li></ol></section><section class="db-tal" id="titans-endurance" style="--d:3"><h3>Титаническая стойкость<small>Titan’s Endurance</small></h3><p class="db-note">после «Удар в слабое место»</p><p>За каждые 30 с в бою <span class="dbk">Макс. выносливость</span> увеличивается на 10%, вплоть до +<span class="dbk">Макс. выносливость</span>.</p></section><section class="db-tal" id="increased-vitality" style="--d:0"><h3>Высокая жизнестойкость<small>Increased Vitality</small></h3><ol class="db-ranks"><li><span class="dbk">Макс. здоровье</span> увеличивается на 5%.</li><li><span class="dbk">Макс. здоровье</span> увеличивается на 7%.</li><li><span class="dbk">Макс. здоровье</span> увеличивается на 10%.</li></ol></section><section class="db-tal" id="carnage" style="--d:1"><h3>Побоище<small>Carnage</small></h3><p class="db-note">после «Высокая жизнестойкость»</p><p><span class="dbk">Сила</span> увеличивается на 5% за каждого убитого врага, вплоть до 50%. Исцеление обнуляет счетчик.</p></section><section class="db-tal" id="cruelty" style="--d:2"><h3>Жестокость<small>Cruelty</small></h3><p class="db-note">после «Побоище»</p><p>За каждого убитого врага ваша макс. выносливость увеличивается на 5, вплоть до 30. Исцеление сбрасывает счетчик.</p></section><section class="db-tal" id="unstoppable-rage" style="--d:1"><h3>Неудержимое неистовство<small>Unstoppable Rage</small></h3><p class="db-note">после «Высокая жизнестойкость»</p><p><span class="dbk">Сила</span> увеличивается на 1% за потерю каждых 10 очков характеристики «<span class="dbk">Макс. здоровье</span>».</p></section><section class="db-tal" id="furious-assault" style="--d:2"><h3>Яростный натиск<small>Furious Assault</small></h3><p class="db-note">после «Неудержимое неистовство»</p><ol class="db-ranks"><li>За кажд 10 потерянн. очк. характеристики «<span class="dbk">Здоровье</span>» <span class="dbk">Скорость атаки</span> увеличивается на 1%.</li><li>За кажд 10 потерянн. очк. характеристики «<span class="dbk">Здоровье</span>» <span class="dbk">Скорость атаки</span> увеличивается на 2%.</li></ol></section></template>
