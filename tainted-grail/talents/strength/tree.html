овня">?</span>.</li><li>За каждый <span class="dbk">последовательный</span> удар одноручным оружием урон увеличивается на 2%, вплоть до +<span class="dbq" title="значение зависит от уровня">?</span>.</li><li>За каждый <span class="dbk">последовательный</span> удар одноручным оружием урон увеличивается на 3%, вплоть до +<span class="dbq" title="значение зависит от уровня">?</span>.</li></ol></section><section class="db-tal" id="strikes-of-luck" style="--d:2"><h3>Удачные удары<small>Strikes of Luck</small></h3><p class="db-note">после «Нескончаемый натиск»</p><ol class="db-ranks"><li>За каждый <span class="dbk">последовательный удар</span> одноручным оружием шанс <span class="dbk">критического попадания</span> увеличивается на 1%, вплоть до 1%.</li><li>За каждый <span class="dbk">последовательный удар</span> одноручным оружием шанс <span class="dbk">критического попадания</span> увеличивается на 2%, вплоть до 2%.</li><li>За каждый <span class="dbk">последовательный удар</span> одноручным оружием шанс <span class="dbk">критического попадания</span> увеличивается на 3%, вплоть до 3%.</li></ol></section><section class="db-tal" id="duelist" style="--d:2"><h3>Дуэлянт<small>Duelist</small></h3><p class="db-note">после «Нескончаемый натиск»</p><p>Если ваша вторая рука пуста, расход выносливости на парирование уменьшается на 50%.</p></section><section class="db-tal" id="ambidextrous" style="--d:1"><h3>Амбидекстр<small>Ambidextrous</small></h3><p class="db-note">после «Ловкий боец»</p><ol class="db-ranks"><li>На тяжелые атаки с оружием в каждой руке требуется на 20% меньше выносливости.</li><li>На тяжелые атаки с оружием в каждой руке требуется на 35% меньше выносливости.</li></ol></section><section class="db-tal" id="adaptive-combat" style="--d:2"><h3>Подстройка под врага<small>Adaptive Combat</small></h3><p class="db-note">после «Амбидекстр»</p><p>Когда вы сражаетесь двумя видами оружия разного типа, <span class="dbk">Сила</span> увеличивается на 20%.</p></section><section c
