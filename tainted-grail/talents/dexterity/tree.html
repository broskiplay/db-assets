>Истощающий контрудар<small>Draining Riposte</small></h3><p class="db-note">после «Непревзойденное парирование»</p><ol class="db-ranks"><li>Парирование отнимает у врагов на 20% больше выносливости.</li><li>Парирование отнимает у врагов на 40% больше выносливости.</li><li>Парирование отнимает у врагов на 60% больше выносливости.</li></ol></section><section class="db-tal" id="stunning-reflexes" style="--d:2"><h3>Оглушающие рефлексы<small>Stunning Reflexes</small></h3><p class="db-note">после «Истощающий контрудар»</p><ol class="db-ranks"><li>Когда вы парируете, то с шансом 3% <span class="dbk">оглушаете</span> противника.</li><li>Когда вы парируете, то с шансом 6% <span class="dbk">оглушаете</span> противника.</li><li>Когда вы парируете, то с шансом 9% <span class="dbk">оглушаете</span> противника.</li></ol></section><section class="db-tal" id="deadly-riposte" style="--d:2"><h3>Смертоносный контрудар<small>Deadly Riposte</small></h3><p class="db-note">после «Истощающий контрудар»</p><p>При парировании <span class="dbk">Шанс крит. урона</span> для следующей атаки увеличивается на <span class="dbq" title="значение зависит от уровня">?</span>.</p></section><section class="db-tal" id="vampiric-riposte" style="--d:1"><h3>Вытягивающий контрудар<small>Vampiric Riposte</small></h3><p class="db-note">после «Непревзойденное парирование»</p><ol class="db-ranks"><li>При парировании <span class="dbk">Похищение ОЗ</span> для следующей атаки увеличивается на <span class="dbq" title="значение зависит от уровня">?</span>.</li><li>При парировании <span class="dbk">Похищение ОЗ</span> для следующей атаки увеличивается на <span class="dbq" title="значение зависит от уровня">?</span>.</li><li>При парировании <span class="dbk">Похищение ОЗ</span> для следующей атаки увеличивается на <span class="dbq" title="значение зависит от уровня">?</span>.</li></ol></section><section class="db-tal" id="deflecting-parry" style="--d:1"><h3>Отражающее парирование<small>Deflecting Parry</small></h3><p class="db-note">после «Непревзойденное парирование»</p><p>Вы можете парировать снаряды, чтобы отражать их.</p></section><section class="db-tal" id="quickened-strikes" style="--d:0"><h3>Ускоренные удары<small>Quickened Strikes</small></h3><ol class="db-ranks"><li>Скорость атаки повышается на 2%.</li><li>Скорость атаки повышается на 4%.</li><li>Скорость атаки повышается на 6%.</li><li>Скорость атаки повышается на 8%.</li></ol></section><section class="db-tal" id="onslaught" style="--d:1"><h3>Штурм<small>Onslaught</small></h3><p class="db-note">после «Ускоренные удары»</p><ol class="db-ranks"><li>За каждый <span class="dbk">последовательный</span> удар <span class="dbk">Скорость атаки</span> увеличивается на 1%, вплоть до 1%.</li><li>За каждый <span class="dbk">последовательный</span> удар <span class="dbk">Скорость атаки</span> увеличивается на 2%, вплоть до 2%.</li></ol></section><section class="db-tal" id="ferocity" style="--d:1"><h3>Свирепость<small>Ferocity</small></h3><p class="db-note">после «Ускоренные удары»</p><ol class="db-ranks"><li>После убийства врага <span class="dbk">Скорость атаки</span> увеличивается на 10% на 5 c.</li><li>После убийства врага <span class="dbk">Скорость атаки</span> увеличивается на 15% на 5 c.</li><li>После убийства врага <span class="dbk">Скорость атаки</span> увеличивается на 20% на 5 c.</li></ol></section><section class="db-tal" id="tools-of-trade" style="--d:1"><h3>Всё под рукой<small>Tools of Trade</small></h3><p class="db-note">после «Ускоренные удары»</p><p>Время на смену оружия сокращается на 50%.</p></section><section class="db-tal" id="agility" style="--d:0"><h3>Проворство<small>Agility</small></h3><ol class="db-ranks"><li>На рывок требуется на 20% меньше выносливости.</li><li>На рывок требуется на 40% меньше выносливости.</li><li>На рывок требуется на 60% меньше выносливости.</li></ol></section><section class="db-tal" id="athletic-build" style="--d:1"><h3>Атлетическое телосложение<small>Athletic Build</small></h3><p class="db-note">после «Проворство»</p><p>+1 к длинным рывкам.</p></section><section class="db-tal" id="fast-reflexes" style="--d:1"><h3>Быстрая реакция<small>Fast Reflexes</small></h3><p class="db-note">после «Проворство»</p><ol class="db-ranks"><li>Рывки восстанавливаются на 20% быстрее.</li><li>Рывки восстанавливаются на 30% быстрее.</li></ol></section><section class="db-tal" id="temporal-slip" style="--d:2"><h3>Скольжение сквозь время<small>Temporal Slip</small></h3><p class="db-note">после «Быстрая реакция»</p><p>Скольжение замедляет время на 2 c.</p></section><section class="db-tal" id="strong-arm-of-the-bowmaster" style="--d:0"><h3>Сильная рука мастера лука<small>Strong Arm of the Bowmaster</small></h3><ol class="db-ranks"><li>Затраты выносливости на удержание натянутого лука снижены на 50%.</li><li>Затраты выносливости на удержание натянутого лука снижены на 90%.</li></ol></section><section class="db-tal" id="proper-draw-technique" style="--d:1"><h3>Правильная техника натяжения<small>Proper Draw Technique</small></h3><p class="db-note">после «Сильная рука мастера лука»</p><p>На натягивание лука требуется на 25% меньше выносливости.</p></section><section class="db-tal" id="lucky-shot" style="--d:2"><h3>Удачный выстрел<small>Lucky Shot</small></h3><p class="db-note">после «Правильная техника натяжения»</p><ol class="db-ranks"><li><span class="dbk">Критические попадания</span> стрелами с шансом 25% возвращают вам стрелы x1.</li><li><span class="dbk">Критические попадания</span> стрелами с шансом 50% возвращают вам стрелы x1.</li><li><span class="dbk">Критические попадания</span> стрелами с шансом 75% возвращают вам стрелы x1.</li></ol></section><section class="db-tal" id="eagle-eye" style="--d:2"><h3>Орлиный глаз<small>Eagle Eye</small></h3><p class="db-note">после «Правильная техника натяжения»</p><p>Приближение при использовании лука значительно увеличено.</p></section><section class="db-tal" id="unnatural-focus" style="--d:3"><h3>Нечеловеческое сосредоточение<small>Unnatural Focus</small></h3><p class="db-note">после «Орлиный глаз»</p><ol class="db-ranks"><li>Когда вы приближаете вид с натянутым луком, замедляется время, но расходуется <span class="dbk">Выносливость</span> (20% в секунду).</li><li>Когда вы приближаете вид с натянутым луком, замедляется время, но расходуется <span class="dbk">Выносливость</span> (15% в секунду).</li><li>Когда вы приближаете вид с натянутым луком, замедляется время, но расходуется <span class="dbk">Выносливость</span> (10% в секунду).</li></ol></section><section class="db-tal" id="marksman" style="--d:1"><h3>Меткий стрелок<small>Marksman</small></h3><p class="db-note">после «Сильная рука мастера лука»</p><ol class="db-ranks"><li>Чем дальше вы от противника, тем больше урона наносите, вплоть до 50%.</li><li>Чем дальше вы от противника, тем больше урона наносите, вплоть до 80%.</li><li>Чем дальше вы от противника, тем больше урона наносите, вплоть до 100%.</li></ol></section><section class="db-tal" id="rack-them-up" style="--d:2"><h3>Одна за другой<small>Rack Them Up</small></h3><p class="db-note">после «Меткий стрелок»</p><ol class="db-ranks"><li>При убийстве <span class="dbk">Скорость натяжения лука</span> для следующей стрелы увеличивается на 20%.</li><li>При убийстве <span class="dbk">Скорость натяжения лука</span> для следующей стрелы увеличивается на 40%.</li><li>При убийстве <span class="dbk">Скорость натяжения лука</span> для следующей стрелы увеличивается на 60%.</li></ol></section><section class="db-tal" id="strong-back" style="--d:2"><h3>Крепкая спина<small>Strong Back</small></h3><p class="db-note">после «Меткий стрелок»</p><ol class="db-ranks"><li>Скорость натяжения лука увеличивается на 10%.</li><li>Скорость натяжения лука увеличивается на 15%.</li><li>Скорость натяжения лука увеличивается на 20%.</li></ol></section><section class="db-tal" id="powerful-draw" style="--d:2"><h3>Мощное натяжение<small>Powerful Draw</small></h3><p class="db-note">после «Меткий стрелок»</p><ol class="db-ranks"><li>При полном натяжении стрелы с шансом 10% <span class="dbk">оглушают</span> противника.</li><li>При полном натяжении стрелы с шансом 20% <span class="dbk">оглушают</span> противника.</li></ol></section><section class="db-tal" id="deadly-aim" style="--d:1"><h3>Смертоносная меткость<small>Deadly Aim</small></h3><p class="db-note">после «Сильная рука мастера лука»</p><ol class="db-ranks"><li>Наносит 50% доп. урона при попадании по вражеским <span class="dbk">слабым местам</span>.</li><li>Наносит 85% доп. урона при попадании по вражеским <span class="dbk">слабым местам</span>.</li></ol></section><section class="db-tal" id="piercing-volley" style="--d:2"><h3>Пронзающий залп<small>Piercing Volley</small></h3><p class="db-note">после «Смертоносная меткость»</p><p>Стрелы и метательные снаряды пробивают 1 противника насквозь.</p></section><section class="db-tal" id="impaling-shot" style="--d:3"><h3>Пробивающий выстрел<small>Impaling Shot</small></h3><p class="db-note">после «Пронзающий залп»</p><p>Выстрел в противника, <span class="dbk">Макс. здоровье</span> которого ниже 35%, вызывает <span class="dbk">кровотечение</span>.</p></section><section class="db-tal" id="cheaters-trickshot" style="--d:2"><h3>Хитрый выстрел обманщика<small>Cheater’s Trickshot</small></h3><p class="db-note">после «Смертоносная меткость»</p><ol class="db-ranks"><li>Вы с шансом 5% получаете бонус к урону за <span class="dbk">слабое место</span>, даже если стрела не попадает в <span class="dbk">слабое место</span>.</li><li>Вы с шансом 10% получаете бонус к урону за <span class="dbk">слабое место</span>, даже если стрела не попадает в <span class="dbk">слабое место</span>.</li></ol></section><section class="db-tal" id="aim-for-the-eyes" style="--d:3"><h3>Прямо в глаз<small>Aim for the Eyes</small></h3><p class="db-note">после «Хитрый выстрел обманщика»</p><p>Выстрел в <span class="dbk">слабое место</span> с шансом 10% <span class="dbk">ослепляет</span> цель на 10 c.</p></section><section class="db-tal" id="unending-volley" style="--d:3"><h3>Бесконечный залп<small>Unending Volley</small></h3><p class="db-note">после «Хитрый выстрел обманщика»</p><ol class="db-ranks"><li>При выстреле в <span class="dbk">слабое место</span> на 10 восстанавливается <span class="dbk">Выносливость</span>.</li><li>При выстреле в <span class="dbk">слабое место</span> на 20 восстанавливается <span class="dbk">Выносливость</span>.</li></ol></section></template>
