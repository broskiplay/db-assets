сильнее, если вы не носите броню.</li></ol></section><section class="db-tal" id="dvoynoe-izmenenie" style="--d:1"><h3>Двойное изменение</h3><p class="db-note">после «Новичок школы изменения»</p><p><small class="db-req">Изменение 20</small> При сотворении заклинания школы изменения с двух рук получается его более сильный вариант.</p></section><section class="db-tal" id="postoyanstvo" style="--d:3"><h3>Постоянство</h3><p class="db-note">после «Адепт школы изменения»</p><p><small class="db-req">Изменение 70</small> Заклинания изменения держатся дольше.</p></section><section class="db-tal" id="ekspert-shkoly-izmeneniya" style="--d:3"><h3>Эксперт школы изменения</h3><p class="db-note">после «Адепт школы изменения»</p><p><small class="db-req">Изменение 75</small> Заклинания школы изменения уровня эксперта расходуют вдвое меньше магии.</p></section><section class="db-tal" id="master-shkoly-izmeneniya" style="--d:4"><h3>Мастер школы изменения</h3><p class="db-note">после «Эксперт школы изменения»</p><p><small class="db-req">Изменение 100</small> Заклинания школы изменения уровня мастера расходуют вдвое меньше магии.</p></section><section class="db-tal" id="atronakh" style="--d:4"><h3>Атронах</h3><p class="db-note">после «Эксперт школы изменения»</p><p><small class="db-req">Изменение 100</small> Вы поглощаете 30% магии от любых заклинаний, попавших в вас.</p></section></template>
