ует ключ, вы автоматически получаете его копию.</p></section><section class="db-tal" id="vzlomshchik-ekspert" style="--d:3"><h3>Взломщик-эксперт</h3><p class="db-note">после «Взломщик-специалист»</p><p><small class="db-req">Взлом 75</small> Замки уровня эксперта значительно легче взломать.</p></section><section class="db-tal" id="zamochnyy-master" style="--d:4"><h3>Замочный мастер</h3><p class="db-note">после «Взломщик-эксперт»</p><p><small class="db-req">Взлом 80</small> Начальное положение отмычки ближе к правильной позиции.</p></section><section class="db-tal" id="vzlomshchik-master" style="--d:4"><h3>Взломщик-мастер</h3><p class="db-note">после «Взломщик-эксперт»</p><p><small class="db-req">Взлом 100</small> Замки уровня мастера значительно легче взломать.</p></section><section class="db-tal" id="vechnaya-otmychka" style="--d:5"><h3>Вечная отмычка</h3><p class="db-note">после «Замочный мастер»</p><p><small class="db-req">Взлом 100</small> Отмычки не ломаются.</p></section></template>
