section class="db-tal" id="krushitel-cherepov" style="--d:1"><h3>Крушитель черепов</h3><p class="db-note">после «Варвар»</p><ol class="db-ranks"><li><small class="db-req">Двуручное оружие 30</small> Удары боевым молотом игнорируют 25% брони.</li><li><small class="db-req">Двуручное оружие 60</small> Удары боевым молотом игнорируют 50% брони.</li><li><small class="db-req">Двуручное оружие 90</small> Удары боевым молотом игнорируют 75% брони.</li></ol></section><section class="db-tal" id="varvar" style="--d:0"><h3>Варвар</h3><ol class="db-ranks"><li>Двуручное оружие наносит на 20% больше урона.</li><li><small class="db-req">Двуручное оружие 20</small> Двуручное оружие наносит на 40% больше урона.</li><li><small class="db-req">Двуручное оружие 40</small> Двуручное оружие наносит на 60% больше урона.</li><li><small class="db-req">Двуручное оружие 60</small> Двуручное оружие наносит на 80% больше урона.</li><li><small class="db-req">Двуручное оружие 80</small> Двуручное оружие наносит вдвое больше урона.</li></ol></section><section class="db-tal" id="glubokie-rany" style="--d:1"><h3>Глубокие раны</h3><p class="db-note">после «Варвар»</p><ol class="db-ranks"><li><small class="db-req">Двуручное оружие 30</small> Удары двуручным мечом с 10% вероятностью наносят критический урон.</li><li><small class="db-req">Двуручное оружие 60</small> Удары двуручным мечом с вероятностью 15% наносят больше критического урона.</li><li><small class="db-req">Двуручное оружие 90</small> Удары двуручным мечом с 20% вероятностью наносят еще больше критического урона.</li></ol></section><section class="db-tal" id="stoyka-chempiona" style="--d:1"><h3>Стойка чемпиона</h3><p class="db-note">после «Варвар»</p><p><small class="db-req">Двуручное оружие 20</small> Силовые атаки двуручным оружием расходуют на 25% меньше сил.</p></section><section class="db-tal" id="raschlenitel" style="--d:1"><h3>Расчленитель</h3><p class="db-note">после «Варвар»</p><ol class="db-ranks"><li><small class="db-req">Двуручное оружие 30</small> Атаки секирой наносят дополнительный урон от кровопотери.</li><li><small class="db-req">Двуручное оружие 60</small> Атаки секирой наносят больше урона от кровопотери.</li><li><small class="db-req">Двуручное оружие 90</small> Атаки секирой наносят еще больше урона от кровопотери.</li></ol></section><section class="db-tal" id="sokrushitelnyy-udar" style="--d:2"><h3>Сокрушительный удар</h3><p class="db-note">после «Стойка чемпиона»</p><p><small class="db-req">Двуручное оружие 50</small> Силовые атаки стоя наносят 25% дополнительного урона с некоторым шансом отрубить противнику голову.</p></section><section class="db-tal" id="velikiy-ryvok" style="--d:2"><h3>Великий рывок</h3><p class="db-note">после «Стойка чемпиона»</p><p><small class="db-req">Двуручное оружие 50</small> Вы можете провести силовую атаку двуручным оружием в спринте, нанеся двойной критический урон.</p></section><section class="db-tal" id="veernaya-ataka" style="--d:3"><h3>Веерная атака</h3><p class="db-note">после «Сокрушительный удар» или «Великий рывок»</p><p><small class="db-req">Двуручное оружие 70</small> Силовые атаки двуручным оружием при движении вбок наносят урон всем противникам перед вами.</p></section><section class="db-tal" id="master-boevykh-iskusstv" style="--d:4"><h3>Мастер боевых искусств</h3><p class="db-note">после «Веерная атака»</p><p><small class="db-req">Двуручное оружие 100</small> Силовая атака при движении назад парализует противника с вероятностью 25%.</p></section></template>
