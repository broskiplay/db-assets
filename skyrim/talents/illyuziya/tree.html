 школы иллюзии</title><g transform="translate(323 -166)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/illyuziya/#master-razuma" data-sub="0" aria-label="Мастер разума"><title>Мастер разума</title><g transform="translate(139 -306)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/illyuziya/#neistovstvo" data-sub="0" aria-label="Неистовство"><title>Неистовство</title><g transform="translate(197 -220)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/illyuziya/#master-shkoly-illyuzii" data-sub="0" aria-label="Мастер школы иллюзии"><title>Мастер школы иллюзии</title><g transform="translate(269 -306)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/illyuziya/#ekspert-shkoly-illyuzii" data-sub="0" aria-label="Эксперт школы иллюзии"><title>Эксперт школы иллюзии</title><g transform="translate(342 -220)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="obman-zhivotnykh" style="--d:1"><h3>Обман животных</h3><p class="db-note">после «Новичок школы иллюзии»</p><p><small class="db-req">Иллюзия 20</small> Заклинания иллюзии действуют на животных более высокого уровня.</p></section><section class="db-tal" id="novichok-shkoly-illyuzii" style="--d:0"><h3>Новичок школы иллюзии</h3><p>Заклинания школы иллюзии уровня новичка расходуют вдвое меньше магии.</p></section><section class="db-tal" id="dvoynaya-illyuziya" style="--d:1"><h3>Двойная иллюзия</h3><p class="db-note">после «Новичок школы иллюзии»</p><p><small class="db-req">Иллюзия 20</small> При сотворении заклинания школы иллюзий с двух рук получается его более сильный вариант.</p></section><section class="db-tal" id="obman-lyudskikh-glaz" style="--d:2"><h3>Обман людских глаз</h3><p class="db-note">после «Обман животных»</p><p><small class="db-req">Иллюзия 40</small> Все заклинания иллюзии действуют на людей более высокого уровня.</p></section><section class="db-tal" id="besshumnye-zaklinaniya" style="--d:3"><h3>Бесшумные заклинания</h3><p class="db-note">после «Обман людских глаз»</p><p><small class="db-req">Иллюзия 50</small> Вы творите любые заклинания любой школы магии совершенно бесшумно для других.</p></section><section class="db-tal" id="gipnoticheskiy-vzglyad" style="--d:1"><h3>Гипнотический взгляд</h3><p class="db-note">после «Новичок школы иллюзии»</p><p><small class="db-req">Иллюзия 30</small> Заклинания успокоения применимы к противникам более высокого уровня. Сочетается с "Обманом людских глаз" и "Обманом животных".</p></section><section class="db-tal" id="nauka-strakha" style="--d:2"><h3>Наука страха</h3><p class="db-note">после «Гипнотический взгляд»</p><p><small class="db-req">Иллюзия 50</small> Заклинания страха применимы к противникам более высокого уровня. Сочетается с "Обманом людских глаз" и "Обманом животных".</p></section><section class="db-tal" id="uchenik-shkoly-illyuzii" style="--d:1"><h3>Ученик школы иллюзии</h3><p class="db-note">после «Новичок школы иллюзии»</p><p><small class="db-req">Иллюзия 25</small> Заклинания школы иллюзии уровня ученика расходуют вдвое меньше магии.</p></section><section class="db-tal" id="adept-shkoly-illyuzii" style="--d:2"><h3>Адепт школы иллюзии</h3><p class="db-note">после «Ученик школы иллюзии»</p><p><small class="db-req">Иллюзия 50</small> Заклинания школы иллюзии уровня адепта расходуют вдвое меньше магии.</p></section><section class="db-tal" id="master-razuma" style="--d:4"><h3>Мастер разума</h3><p class="db-note">после «Бесшумные заклинания» или «Неистовство»</p><p><small class="db-req">Иллюзия 90</small> Заклинания школы иллюзии действуют на нежить, даэдра и механизмы.</p></section><section class="db-tal" id="neistovstvo" style="--d:3"><h3>Неистовство</h3><p class="db-note">после «Наука страха»</p><p><small class="db-req">Иллюзия 70</small> Заклинания бешенства применимы к противникам более высокого уровня. Сочетается с "Обманом людских глаз" и "Обманом животных".</p></section><section class="db-tal" id="master-shkoly-illyuzii" style="--d:4"><h3>Мастер школы иллюзии</h3><p class="db-note">после «Эксперт школы иллюзии»</p><p><small class="db-req">Иллюзия 100</small> Заклинания школы иллюзии уровня мастера расходуют вдвое меньше магии.</p></section><section class="db-tal" id="ekspert-shkoly-illyuzii" style="--d:3"><h3>Эксперт школы иллюзии</h3><p class="db-note">после «Адепт школы иллюзии»</p><p><small class="db-req">Иллюзия 75</small> Заклинания школы иллюзии уровня эксперта расходуют вдвое меньше магии.</p></section></template>
