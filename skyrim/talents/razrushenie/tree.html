><title>Адепт школы разрушения</title><g transform="translate(149 -191)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/razrushenie/#dezintegratsiya" data-sub="0" aria-label="Дезинтеграция"><title>Дезинтеграция</title><g transform="translate(221 -277)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/razrushenie/#glubokaya-zamorozka" data-sub="0" aria-label="Глубокая заморозка"><title>Глубокая заморозка</title><g transform="translate(313 -248)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/razrushenie/#zharkoe-plamya" data-sub="0" aria-label="Жаркое пламя"><title>Жаркое пламя</title><g transform="translate(405 -191)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/razrushenie/#ekspert-shkoly-razrusheniya" data-sub="0" aria-label="Эксперт школы разрушения"><title>Эксперт школы разрушения</title><g transform="translate(95 -274)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/razrushenie/#master-shkoly-razrusheniya" data-sub="0" aria-label="Мастер школы разрушения"><title>Мастер школы разрушения</title><g transform="translate(76 -418)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="dvoynoe-razrushenie" style="--d:1"><h3>Двойное разрушение</h3><p class="db-note">после «Новичок школы разрушения»</p><p><small class="db-req">Разрушение 20</small> При сотворении заклинания школы разрушения с двух рук получается его более сильный вариант.</p></section><section class="db-tal" id="novichok-shkoly-razrusheniya" style="--d:0"><h3>Новичок школы разрушения</h3><p>Заклинания школы разрушения уровня новичка расходуют вдвое меньше магии.</p></section><section class="db-tal" id="master-run" style="--d:2"><h3>Мастер рун</h3><p class="db-note">после «Ученик школы разрушения»</p><p><small class="db-req">Разрушение 40</small> Вы можете ставить руны на впятеро большее расстояние.</p></section><section class="db-tal" id="udarnaya-volna" style="--d:2"><h3>Ударная волна</h3><p class="db-note">после «Двойное разрушение»</p><p><small class="db-req">Разрушение 40</small> Большинство заклинаний разрушения при применении с двух рук заставляют противника потерять равновесие.</p></section><section class="db-tal" id="uchenik-shkoly-razrusheniya" style="--d:1"><h3>Ученик школы разрушения</h3><p class="db-note">после «Новичок школы разрушения»</p><p><small class="db-req">Разрушение 25</small> Заклинания школы разрушения уровня ученика расходуют вдвое меньше магии.</p></section><section class="db-tal" id="usilennyy-moroz" style="--d:1"><h3>Усиленный мороз</h3><p class="db-note">после «Новичок школы разрушения»</p><ol class="db-ranks"><li><small class="db-req">Разрушение 30</small> Заклинания холода наносят на 25% больше урона.</li><li><small class="db-req">Разрушение 60</small> Заклинания холода наносят на 50% больше урона.</li></ol></section><section class="db-tal" id="usilennye-molnii" style="--d:1"><h3>Усиленные молнии</h3><p class="db-note">после «Новичок школы разрушения»</p><ol class="db-ranks"><li><small class="db-req">Разрушение 30</small> Заклинания электричества наносят на 25% больше урона.</li><li><small class="db-req">Разрушение 60</small> Заклинания электричества наносят на 50% больше урона.</li></ol></section><section class="db-tal" id="usilennoe-plamya" style="--d:1"><h3>Усиленное пламя</h3><p class="db-note">после «Новичок школы разрушения»</p><ol class="db-ranks"><li><small class="db-req">Разрушение 30</small> Огненные заклинания наносят на 25% больше урона.</li><li><small class="db-req">Разрушение 60</small> Огненные заклинания наносят на 50% больше урона.</li></ol></section><section class="db-tal" id="adept-shkoly-razrusheniya" style="--d:2"><h3>Адепт школы разрушения</h3><p class="db-note">после «Ученик школы разрушения»</p><p><small class="db-req">Разрушение 50</small> Заклинания школы разрушения уровня адепта расходуют вдвое меньше магии.</p></section><section class="db-tal" id="dezintegratsiya" style="--d:2"><h3>Дезинтеграция</h3><p class="db-note">после «Усиленные молнии»</p><p><small class="db-req">Разрушение 70</small> Урон от электричества дезинтегрирует противника, если его уровень здоровья низок.</p></section><section class="db-tal" id="glubokaya-zamorozka" style="--d:2"><h3>Глубокая заморозка</h3><p class="db-note">после «Усиленный мороз»</p><p><small class="db-req">Разрушение 60</small> Урон от холода парализует противника, если его уровень здоровья низок.</p></section><section class="db-tal" id="zharkoe-plamya" style="--d:2"><h3>Жаркое пламя</h3><p class="db-note">после «Усиленное пламя»</p><p><small class="db-req">Разрушение 50</small> Урон от огня обращает противника в бегство, если его уровень здоровья низок.</p></section><section class="db-tal" id="ekspert-shkoly-razrusheniya" style="--d:3"><h3>Эксперт школы разрушения</h3><p class="db-note">после «Адепт школы разрушения»</p><p><small class="db-req">Разрушение 75</small> Заклинания школы разрушения уровня эксперта расходуют вдвое меньше магии.</p></section><section class="db-tal" id="master-shkoly-razrusheniya" style="--d:4"><h3>Мастер школы разрушения</h3><p class="db-note">после «Эксперт школы разрушения»</p><p><small class="db-req">Разрушение 100</small> Заклинания школы разрушения уровня мастера расходуют вдвое меньше магии.</p></section></template>
