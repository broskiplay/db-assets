</small> Цены при покупке и продаже выгоднее на 20%.</li><li><small class="db-req">Красноречие 60</small> Цены при покупке и продаже выгоднее на 25%.</li><li><small class="db-req">Красноречие 80</small> Цены при покупке и продаже выгоднее на 30%.</li></ol></section><section class="db-tal" id="podkup" style="--d:1"><h3>Подкуп</h3><p class="db-note">после «Торговец»</p><p><small class="db-req">Красноречие 30</small> Вы можете подкупать стражников, чтобы они не замечали преступления.</p></section><section class="db-tal" id="ocharovanie" style="--d:1"><h3>Очарование</h3><p class="db-note">после «Торговец»</p><p><small class="db-req">Красноречие 30</small> При торговле с представителем противоположного пола цены выгоднее на 10%.</p></section><section class="db-tal" id="ubezhdenie" style="--d:2"><h3>Убеждение</h3><p class="db-note">после «Подкуп»</p><p><small class="db-req">Красноречие 50</small> Попытки убеждения облегчаются на 30%.</p></section><section class="db-tal" id="kupets" style="--d:2"><h3>Купец</h3><p class="db-note">после «Очарование»</p><p><small class="db-req">Красноречие 50</small> Вы можете продавать любые предметы любым торговцам.</p></section><section class="db-tal" id="zapugivanie" style="--d:3"><h3>Запугивание</h3><p class="db-note">после «Убеждение»</p><p><small class="db-req">Красноречие 70</small> Угрозы становятся вдвое успешнее.</p></section><section class="db-tal" id="vkladchik" style="--d:3"><h3>Вкладчик</h3><p class="db-note">после «Купец»</p><p><small class="db-req">Красноречие 70</small> Вы можете вложить 500 золотых в любой магазин, чтобы навсегда увеличить доступный запас золота его владельца.</p></section><section class="db-tal" id="velikiy-torgovets" style="--d:5"><h3>Великий торговец</h3><p class="db-note">после «Скупщик»</p><p><small class="db-req">Красноречие 100</small> Каждый торговец в этом мире получает дополнительно 1000 золотых для торговли.</p></section><section class="db-tal" id="skupshchik" style="--d:4"><h3>Скупщик</h3><p class="db-note">после «Вкладчик»</p><p><small class="db-req">Красноречие 90</small> Вы можете торговать краденым с любым торговцем, в чье дело вы вложили средства.</p></section></template>
