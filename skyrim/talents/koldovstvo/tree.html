<h3>Новичок школы колдовства</h3><p>Заклинания школы колдовства уровня новичка расходуют вдвое меньше магии.</p></section><section class="db-tal" id="uchenik-shkoly-koldovstva" style="--d:1"><h3>Ученик школы колдовства</h3><p class="db-note">после «Новичок школы колдовства»</p><p><small class="db-req">Колдовство 25</small> Заклинания школы колдовства уровня ученика расходуют вдвое меньше магии.</p></section><section class="db-tal" id="misticheskiy-prizyv" style="--d:1"><h3>Мистический призыв</h3><p class="db-note">после «Новичок школы колдовства»</p><p><small class="db-req">Колдовство 20</small> Призванное оружие наносит больше урона.</p></section><section class="db-tal" id="pokhititel-dush" style="--d:2"><h3>Похититель душ</h3><p class="db-note">после «Мистический призыв»</p><p><small class="db-req">Колдовство 30</small> Призванное оружие захватывает души врагов.</p></section><section class="db-tal" id="dvoynoe-koldovstvo" style="--d:1"><h3>Двойное колдовство</h3><p class="db-note">после «Новичок школы колдовства»</p><p><small class="db-req">Колдовство 20</small> При сотворении заклинания школы колдовства с двух рук заклинание держится дольше.</p></section><section class="db-tal" id="nekromantiya" style="--d:1"><h3>Некромантия</h3><p class="db-note">после «Новичок школы колдовства»</p><p><small class="db-req">Колдовство 40</small> Поднятая нежить остается в вашей власти дольше.</p></section><section class="db-tal" id="prizyvatel" style="--d:1"><h3>Призыватель</h3><p class="db-note">после «Новичок школы колдовства»</p><ol class="db-ranks"><li><small class="db-req">Колдовство 30</small> Вы можете призывать атронахов или поднимать нежить на вдвое большем расстоянии.</li><li><small class="db-req">Колдовство 70</small> Вы можете призывать атронахов или поднимать нежить на втрое большем расстоянии.</li></ol></section><section class="db-tal" id="atromantiya" style="--d:2"><h3>Атромантия</h3><p class="db-note">после «Призыватель»</p><p><small class="db-req">Колдовство 40</small> Призванные атронахи существуют вдвое дольше.</p></section><section class="db-tal" id="adept-shkoly-koldovstva" style="--d:2"><h3>Адепт школы колдовства</h3><p class="db-note">после «Ученик школы колдовства»</p><p><small class="db-req">Колдовство 50</small> Заклинания школы колдовства уровня адепта расходуют вдвое меньше магии.</p></section><section class="db-tal" id="izgnanie-v-oblivion" style="--d:3"><h3>Изгнание в Обливион</h3><p class="db-note">после «Похититель душ»</p><p><small class="db-req">Колдовство 50</small> Призванное оружие изгоняет призванных существ и обращает поднятую нежить в бегство.</p></section><section class="db-tal" id="temnye-dushi" style="--d:2"><h3>Темные души</h3><p class="db-note">после «Некромантия»</p><p><small class="db-req">Колдовство 70</small> Поднятая нежить получает дополнительно 100 единиц здоровья.</p></section><section class="db-tal" id="sila-stikhiy" style="--d:3"><h3>Сила стихий</h3><p class="db-note">после «Атромантия»</p><p><small class="db-req">Колдовство 80</small> Призванные атронахи на 50% сильнее.</p></section><section class="db-tal" id="ekspert-shkoly-koldovstva" style="--d:3"><h3>Эксперт школы колдовства</h3><p class="db-note">после «Адепт школы колдовства»</p><p><small class="db-req">Колдовство 75</small> Заклинания школы колдовства уровня эксперта расходуют вдвое меньше магии.</p></section><section class="db-tal" id="master-shkoly-koldovstva" style="--d:4"><h3>Мастер школы колдовства</h3><p class="db-note">после «Эксперт школы колдовства»</p><p><small class="db-req">Колдовство 100</small> Заклинания школы колдовства уровня мастера расходуют вдвое меньше магии.</p></section><section class="db-tal" id="parnye-dushi" style="--d:3"><h3>Парные души</h3><p class="db-note">после «Темные души» или «Сила стихий»</p><p><small class="db-req">Колдовство 100</small> Вы можете вызвать двух атронахов или поднять двух зомби.</p></section></template>
