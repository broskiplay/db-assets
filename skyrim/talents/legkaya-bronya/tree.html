orm="translate(187 -191)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/legkaya-bronya/#polnyy-komplekt" data-sub="0" aria-label="Полный комплект"><title>Полный комплект</title><g transform="translate(13 -302)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/legkaya-bronya/#krylya-vetra" data-sub="0" aria-label="Крылья ветра"><title>Крылья ветра</title><g transform="translate(178 -274)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/legkaya-bronya/#lovkiy-boets" data-sub="0" aria-label="Ловкий боец"><title>Ловкий боец</title><g transform="translate(90 -360)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="lovkost-v-oborone" style="--d:0"><h3>Ловкость в обороне</h3><ol class="db-ranks"><li>Класс легкой брони увеличивается на 20%.</li><li><small class="db-req">Лёгкая броня 20</small> Класс легкой брони увеличивается на 40%.</li><li><small class="db-req">Лёгкая броня 40</small> Класс легкой брони увеличивается на 60%.</li><li><small class="db-req">Лёгкая броня 60</small> Класс легкой брони увеличивается на 80%.</li><li><small class="db-req">Лёгкая броня 80</small> Класс легкой брони увеличивается на 100%.</li></ol></section><section class="db-tal" id="podgonka-po-figure" style="--d:1"><h3>Подгонка по фигуре</h3><p class="db-note">после «Ловкость в обороне»</p><p><small class="db-req">Лёгкая броня 30</small> Класс брони увеличивается на 25% при ношении полного комплекта легких доспехов: шлем, кираса, перчатки, сапоги.</p></section><section class="db-tal" id="vtoraya-kozha" style="--d:2"><h3>Вторая кожа</h3><p class="db-note">после «Подгонка по фигуре»</p><p><small class="db-req">Лёгкая броня 50</small> Надетая легкая броня ничего не весит и не замедляет ваши движения.</p></section><section class="db-tal" id="polnyy-komplekt" style="--d:2"><h3>Полный комплект</h3><p class="db-note">после «Подгонка по фигуре»</p><p><small class="db-req">Лёгкая броня 70</small> Дополнительный бонус 25% к классу брони при ношении полного комплекта однотипной легкой брони.</p></section><section class="db-tal" id="krylya-vetra" style="--d:3"><h3>Крылья ветра</h3><p class="db-note">после «Вторая кожа»</p><p><small class="db-req">Лёгкая броня 60</small> Запас сил восстанавливается на 50% быстрее при ношении полного комплекта легких доспехов: шлем, кираса, перчатки, сапоги.</p></section><section class="db-tal" id="lovkiy-boets" style="--d:3"><h3>Ловкий боец</h3><p class="db-note">после «Полный комплект» или «Крылья ветра»</p><p><small class="db-req">Лёгкая броня 100</small> 10% вероятность полностью избежать рукопашного урона при ношении полного комплекта легкой брони: шлем, кираса, перчатки, сапоги.</p></section></template>
