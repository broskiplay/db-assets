 Класс тяжелой брони увеличивается на 80%.</li><li><small class="db-req">Тяжёлая броня 80</small> Класс тяжелой брони увеличивается на 100%.</li></ol></section><section class="db-tal" id="khoroshaya-ekipirovka" style="--d:1"><h3>Хорошая экипировка</h3><p class="db-note">после «Джаггернаут»</p><p><small class="db-req">Тяжёлая броня 30</small> Класс брони увеличивается на 25% при ношении полного комплекта тяжелых доспехов: шлем, кираса, перчатки, сапоги.</p></section><section class="db-tal" id="stalnye-kulaki" style="--d:1"><h3>Стальные кулаки</h3><p class="db-note">после «Джаггернаут»</p><p><small class="db-req">Тяжёлая броня 30</small> При бое без оружия тяжелые перчатки наносят дополнительный урон, равный их классу брони.</p></section><section class="db-tal" id="tsentr-tyazhesti" style="--d:2"><h3>Центр тяжести</h3><p class="db-note">после «Хорошая экипировка»</p><p><small class="db-req">Тяжёлая броня 50</small> При ношении только тяжелой брони вы теряете равновесие на 50% реже.</p></section><section class="db-tal" id="myagkaya-podbivka" style="--d:2"><h3>Мягкая подбивка</h3><p class="db-note">после «Стальные кулаки»</p><p><small class="db-req">Тяжёлая броня 50</small> Вы получаете половину урона от падения, если носите полный комплект тяжелых доспехов: шлем, кираса, перчатки, сапоги.</p></section><section class="db-tal" id="polnyy-komplekt" style="--d:3"><h3>Полный комплект</h3><p class="db-note">после «Центр тяжести»</p><p><small class="db-req">Тяжёлая броня 70</small> Дополнительный бонус 25% к классу брони при ношении полного комплекта однотипной тяжелой брони.</p></section><section class="db-tal" id="upornaya-trenirovka" style="--d:3"><h3>Упорная тренировка</h3><p class="db-note">после «Мягкая подбивка»</p><p><small class="db-req">Тяжёлая броня 70</small> Надетая тяжелая броня ничего не весит и не замедляет ваши движения.</p></section><section class="db-tal" id="otrazhenie-udarov" style="--d:4"><h3>Отражение ударов</h3><p class="db-note">после «Полный комплект»</p><p><small class="db-req">Тяжёлая броня 100</small> 10% шанс отразить рукопашный урон врагу при ношении полного комплекта тяжелой брони: шлем, кираса, перчатки, сапоги.</p></section></template>
