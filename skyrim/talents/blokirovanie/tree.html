--d:1"><h3>Силовой удар плашмя</h3><p class="db-note">после «Щитоносец»</p><p><small class="db-req">Блокирование 30</small> Вы можете наносить силовые удары плашмя.</p></section><section class="db-tal" id="shchitonosets" style="--d:0"><h3>Щитоносец</h3><ol class="db-ranks"><li>Блокирование эффективнее на 20%.</li><li><small class="db-req">Блокирование 20</small> Блокирование эффективнее на 25%.</li><li><small class="db-req">Блокирование 40</small> Блокирование эффективнее на 30%.</li><li><small class="db-req">Блокирование 60</small> Блокирование эффективнее на 35%.</li><li><small class="db-req">Блокирование 80</small> Блокирование эффективнее на 40%.</li></ol></section><section class="db-tal" id="bystrye-refleksy" style="--d:1"><h3>Быстрые рефлексы</h3><p class="db-note">после «Щитоносец»</p><p><small class="db-req">Блокирование 30</small> Если вы блокируете силовую атаку противника, время замедляется.</p></section><section class="db-tal" id="smertelnyy-udar-plashmya" style="--d:2"><h3>Смертельный удар плашмя</h3><p class="db-note">после «Силовой удар плашмя»</p><p><small class="db-req">Блокирование 50</small> Удары плашмя наносят впятеро больше урона.</p></section><section class="db-tal" id="otbivanie-strel" style="--d:1"><h3>Отбивание стрел</h3><p class="db-note">после «Щитоносец»</p><p><small class="db-req">Блокирование 30</small> Стрелы, попадающие в щит, не наносят урона.</p></section><section class="db-tal" id="obezoruzhivanie" style="--d:3"><h3>Обезоруживание</h3><p class="db-note">после «Смертельный удар плашмя»</p><p><small class="db-req">Блокирование 70</small> Вы можете обезоружить противника силовым ударом плашмя.</p></section><section class="db-tal" id="zashchita-ot-stikhiy" style="--d:2"><h3>Защита от стихий</h3><p class="db-note">после «Отбивание стрел»</p><p><small class="db-req">Блокирование 50</small> Закрывшись щитом, вы получаете на 50% меньше урона от огня, холода и электричества.</p></section><section class="db-tal" id="blok-na-begu" style="--d:3"><h3>Блок на бегу</h3><p class="db-note">после «Защита от стихий»</p><p><small class="db-req">Блокирование 70</small> Вы можете быстрее двигаться, закрывшись щитом.</p></section><section class="db-tal" id="zhivoy-molot" style="--d:4"><h3>Живой молот</h3><p class="db-note">после «Блок на бегу» или «Обезоруживание»</p><p><small class="db-req">Блокирование 100</small> Спринт с поднятым щитом сбивает с ног большинство противников.</p></section></template>
