</li></ol></section><section class="db-tal" id="boevaya-stoyka" style="--d:1"><h3>Боевая стойка</h3><p class="db-note">после «Сильная рука»</p><p><small class="db-req">Одноручное оружие 20</small> Силовые атаки одноручным оружием расходуют на 25% меньше сил.</p></section><section class="db-tal" id="rubaka" style="--d:1"><h3>Рубака</h3><p class="db-note">после «Сильная рука»</p><ol class="db-ranks"><li><small class="db-req">Одноручное оружие 30</small> Удары боевым топором наносят дополнительный урон от кровопотери.</li><li><small class="db-req">Одноручное оружие 60</small> Удары боевым топором наносят больше урона от кровопотери.</li><li><small class="db-req">Одноручное оружие 90</small> Удары боевым топором наносят еще больше урона от кровопотери.</li></ol></section><section class="db-tal" id="dvoynaya-myasorubka" style="--d:2"><h3>Двойная мясорубка</h3><p class="db-note">после «Двойной вихрь»</p><p><small class="db-req">Одноручное оружие 70</small> Силовые атаки с двух рук наносят на 50% больше урона.</p></section><section class="db-tal" id="ryvok" style="--d:2"><h3>Рывок</h3><p class="db-note">после «Боевая стойка»</p><p><small class="db-req">Одноручное оружие 50</small> Вы можете провести силовую атаку одноручным оружием в спринте, нанеся двойной критический урон.</p></section><section class="db-tal" id="bezzhalostnyy-udar" style="--d:2"><h3>Безжалостный удар</h3><p class="db-note">после «Боевая стойка»</p><p><small class="db-req">Одноручное оружие 50</small> Силовые атаки стоя наносят 25% дополнительного урона с некоторым шансом отрубить противнику голову.</p></section><section class="db-tal" id="paralizuyushchiy-udar" style="--d:3"><h3>Парализующий удар</h3><p class="db-note">после «Безжалостный удар» или «Рывок»</p><p><small class="db-req">Одноручное оружие 100</small> Силовая атака при движении назад парализует противника с вероятностью 25%.</p></section></template>
