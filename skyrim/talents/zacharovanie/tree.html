"><li>Новые зачарования сильнее на 20%.</li><li><small class="db-req">Зачарование 20</small> Новые зачарования сильнее на 40%.</li><li><small class="db-req">Зачарование 40</small> Новые зачарования сильнее на 60%.</li><li><small class="db-req">Зачарование 60</small> Новые зачарования сильнее на 80%.</li><li><small class="db-req">Зачарование 80</small> Новые зачарования сильнее на 100%.</li></ol></section><section class="db-tal" id="ekonomiya-dush" style="--d:1"><h3>Экономия душ</h3><p class="db-note">после «Зачарователь»</p><p><small class="db-req">Зачарование 20</small> Камни душ дают дополнительную магию для перезарядки.</p></section><section class="db-tal" id="chary-umeniy" style="--d:1"><h3>Чары умений</h3><p class="db-note">после «Зачарователь»</p><p><small class="db-req">Зачарование 50</small> Зачарования навыков, накладываемые на броню, сильнее на 25%.</p></section><section class="db-tal" id="ognennye-chary" style="--d:1"><h3>Огненные чары</h3><p class="db-note">после «Зачарователь»</p><p><small class="db-req">Зачарование 30</small> Огненные зачарования, накладываемые на оружие и броню, сильнее на 25%.</p></section><section class="db-tal" id="poglotitel-dush" style="--d:2"><h3>Поглотитель душ</h3><p class="db-note">после «Экономия душ»</p><p><small class="db-req">Зачарование 40</small> Смертельные удары по существам, но не по людям, приводят к перезарядке оружия на 5% души жертвы.</p></section><section class="db-tal" id="zhiznennye-chary" style="--d:2"><h3>Жизненные чары</h3><p class="db-note">после «Чары умений»</p><p><small class="db-req">Зачарование 70</small> Зачарования здоровья, магии и запаса сил, накладываемые на броню, сильнее на 25%.</p></section><section class="db-tal" id="moroznye-chary" style="--d:2"><h3>Морозные чары</h3><p class="db-note">после «Огненные чары»</p><p><small class="db-req">Зачарование 40</small> Зачарования холода, накладываемые на оружие и броню, сильнее на 25%.</p></section><section class="db-tal" id="grozovye-chary" style="--d:3"><h3>Грозовые чары</h3><p class="db-note">после «Морозные чары»</p><p><small class="db-req">Зачарование 50</small> Зачарования электричества, накладываемые на оружие и броню, сильнее на 25%.</p></section><section class="db-tal" id="dopolnitelnyy-effekt" style="--d:3"><h3>Дополнительный эффект</h3><p class="db-note">после «Жизненные чары» или «Грозовые чары»</p><p><small class="db-req">Зачарование 100</small> Вы можете наложить на один и тот же предмет два зачарования.</p></section></template>
