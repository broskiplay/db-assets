крадетесь.</li><li><small class="db-req">Скрытность 40</small> Вас на 30% труднее обнаружить, когда вы крадетесь.</li><li><small class="db-req">Скрытность 60</small> Вас на 35% труднее обнаружить, когда вы крадетесь.</li><li><small class="db-req">Скрытность 80</small> Вас на 40% труднее обнаружить, когда вы крадетесь.</li></ol></section><section class="db-tal" id="vernyy-pritsel" style="--d:2"><h3>Верный прицел</h3><p class="db-note">после «Удар в спину»</p><p><small class="db-req">Скрытность 40</small> Скрытные стрелковые атаки наносят втрое больше урона.</p></section><section class="db-tal" id="udar-v-spinu" style="--d:1"><h3>Удар в спину</h3><p class="db-note">после «Скрытность»</p><p><small class="db-req">Скрытность 30</small> Скрытные атаки одноручным оружием наносят вшестеро больше урона.</p></section><section class="db-tal" id="priglushennye-shagi" style="--d:1"><h3>Приглушенные шаги</h3><p class="db-note">после «Скрытность»</p><p><small class="db-req">Скрытность 30</small> Броня издает на 50% меньше шума.</p></section><section class="db-tal" id="legkiy-shag" style="--d:2"><h3>Легкий шаг</h3><p class="db-note">после «Приглушенные шаги»</p><p><small class="db-req">Скрытность 40</small> Нажимные пластины не срабатывают, когда вы наступаете на них.</p></section><section class="db-tal" id="klinok-assasina" style="--d:3"><h3>Клинок ассасина</h3><p class="db-note">после «Верный прицел»</p><p><small class="db-req">Скрытность 50</small> Скрытные атаки кинжалами наносят пятнадцатикратный урон.</p></section><section class="db-tal" id="tikhiy-kuvyrok" style="--d:3"><h3>Тихий кувырок</h3><p class="db-note">после «Легкий шаг»</p><p><small class="db-req">Скрытность 50</small> При спринте в режиме скрытности происходит бесшумный кувырок вперед.</p></section><section class="db-tal" id="tishina" style="--d:4"><h3>Тишина</h3><p class="db-note">после «Тихий кувырок»</p><p><small class="db-req">Скрытность 70</small> Ходьба и бег не влияют на обнаружение.</p></section><section class="db-tal" id="voin-teni" style="--d:5"><h3>Воин тени</h3><p class="db-note">после «Тишина»</p><p><small class="db-req">Скрытность 100</small> Присев, вы на мгновение останавливаете бой, а противники на расстоянии теряют вас из виду.</p></section></template>
