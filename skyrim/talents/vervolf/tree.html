облике вервольфа вы наносите на 25% больше урона.</li><li>В облике вервольфа вы наносите на 50% больше урона.</li><li>В облике вервольфа вы наносите на 75% больше урона.</li><li>В облике вервольфа вы наносите на 100% больше урона.</li></ol></section><section class="db-tal" id="totem-ledyanykh-bratev" style="--d:1"><h3>Тотем ледяных братьев</h3><p class="db-note">после «Звериная сила»</p><p>Тотем Братства воем созывает снежных волков.</p></section><section class="db-tal" id="nerazborchivost-v-ede" style="--d:3"><h3>Неразборчивость в еде</h3><p class="db-note">после «Жадность в еде»</p><p>Позволяет пожирать большинство мертвых существ. Поедание существ, а не людей, дает лишь половину добавки времени.</p></section><section class="db-tal" id="totem-luny" style="--d:2"><h3>Тотем луны</h3><p class="db-note">после «Тотем ледяных братьев»</p><p>Тотем Братства воем созывает вервольфов.</p></section><section class="db-tal" id="totem-uzhasa" style="--d:1"><h3>Тотем ужаса</h3><p class="db-note">после «Звериная сила»</p><p>Жуткий вой вервольфа действует даже на существ более высокого уровня.</p></section><section class="db-tal" id="totem-khishchnika" style="--d:1"><h3>Тотем хищника</h3><p class="db-note">после «Звериная сила»</p><p>Тотем Охоты охватывает теперь большую территорию и показывает противников: спокойны ли они, ищут что-то или сражаются.</p></section></template>
