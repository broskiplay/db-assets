><small class="db-req">Стрельба 20</small> Луки наносят на 40% больше урона.</li><li><small class="db-req">Стрельба 40</small> Луки наносят на 60% больше урона.</li><li><small class="db-req">Стрельба 60</small> Луки наносят на 80% больше урона.</li><li><small class="db-req">Стрельба 80</small> Луки наносят вдвое больше урона.</li></ol></section><section class="db-tal" id="orlinyy-vzor" style="--d:1"><h3>Орлиный взор</h3><p class="db-note">после «Избыточное натяжение»</p><p><small class="db-req">Стрельба 30</small> Если нажать клавишу блока при прицеливании, вы приблизите вид цели.</p></section><section class="db-tal" id="kriticheskiy-vystrel" style="--d:1"><h3>Критический выстрел</h3><p class="db-note">после «Избыточное натяжение»</p><ol class="db-ranks"><li><small class="db-req">Стрельба 30</small> 10% вероятность критического попадания, при котором наносится больше урона.</li><li><small class="db-req">Стрельба 60</small> 15% вероятность критического попадания, при котором наносится на 25% больше критического урона.</li><li><small class="db-req">Стрельба 90</small> 20% вероятность критического попадания, при котором наносится на 50% больше критического урона.</li></ol></section><section class="db-tal" id="tverdaya-ruka" style="--d:2"><h3>Твердая рука</h3><p class="db-note">после «Орлиный взор»</p><ol class="db-ranks"><li><small class="db-req">Стрельба 40</small> При прицеливании с приближением вида время замедляется на 25%.</li><li><small class="db-req">Стрельба 60</small> При прицеливании с приближением вида время замедляется на 50%.</li></ol></section><section class="db-tal" id="berezhlivyy-okhotnik" style="--d:2"><h3>Бережливый охотник</h3><p class="db-note">после «Критический выстрел»</p><p><small class="db-req">Стрельба 50</small> На трупах вы находите вдвое больше стрел.</p></section><section class="db-tal" id="moshchnyy-vystrel" style="--d:2"><h3>Мощный выстрел</h3><p class="db-note">после «Орлиный взор»</p><p><small class="db-req">Стрельба 50</small> Стрелы с 50% вероятностью заставляют пошатнуться всех противников, кроме самых крупных.</p></section><section class="db-tal" id="eger" style="--d:3"><h3>Егерь</h3><p class="db-note">после «Бережливый охотник»</p><p><small class="db-req">Стрельба 60</small> Вы можете быстрее двигаться с натянутой тетивой.</p></section><section class="db-tal" id="bystraya-strelba" style="--d:3"><h3>Быстрая стрельба</h3><p class="db-note">после «Мощный выстрел»</p><p><small class="db-req">Стрельба 70</small> Вы натягиваете тетиву на 30% быстрее.</p></section><section class="db-tal" id="snayper" style="--d:4"><h3>Снайпер</h3><p class="db-note">после «Быстрая стрельба» или «Егерь»</p><p><small class="db-req">Стрельба 100</small> 15% вероятность парализовать противника на несколько секунд.</p></section></template>
