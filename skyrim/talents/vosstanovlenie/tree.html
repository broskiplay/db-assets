(579 -108)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/vosstanovlenie/#begstvo-ot-smerti" data-sub="0" aria-label="Бегство от смерти"><title>Бегство от смерти</title><g transform="translate(-25 -191)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/vosstanovlenie/#ekspert-shkoly-vosstanovleniya" data-sub="0" aria-label="Эксперт школы восстановления"><title>Эксперт школы восстановления</title><g transform="translate(269 -335)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/vosstanovlenie/#master-shkoly-vosstanovleniya" data-sub="0" aria-label="Мастер школы восстановления"><title>Мастер школы восстановления</title><g transform="translate(361 -389)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="dvoynoe-vosstanovlenie" style="--d:1"><h3>Двойное восстановление</h3><p class="db-note">после «Новичок школы восстановления»</p><p><small class="db-req">Восстановление 20</small> При сотворении заклинания школы восстановления с двух рук получается его более сильный вариант.</p></section><section class="db-tal" id="novichok-shkoly-vosstanovleniya" style="--d:0"><h3>Новичок школы восстановления</h3><p>Заклинания школы восстановления уровня новичка расходуют вдвое меньше магии.</p></section><section class="db-tal" id="regeneratsiya" style="--d:1"><h3>Регенерация</h3><p class="db-note">после «Новичок школы восстановления»</p><p><small class="db-req">Восстановление 20</small> Лечебные заклинания на 50% более эффективны.</p></section><section class="db-tal" id="vospolnenie" style="--d:1"><h3>Восполнение</h3><p class="db-note">после «Новичок школы восстановления»</p><ol class="db-ranks"><li><small class="db-req">Восстановление 30</small> Магия восстанавливается на 25% быстрее.</li><li><small class="db-req">Восстановление 60</small> Магия восстанавливается на 50% быстрее.</li></ol></section><section class="db-tal" id="uchenik-shkoly-vosstanovleniya" style="--d:1"><h3>Ученик школы восстановления</h3><p class="db-note">после «Новичок школы восстановления»</p><p><small class="db-req">Восстановление 25</small> Заклинания школы восстановления уровня ученика расходуют вдвое меньше магии.</p></section><section class="db-tal" id="adept-shkoly-vosstanovleniya" style="--d:2"><h3>Адепт школы восстановления</h3><p class="db-note">после «Ученик школы восстановления»</p><p><small class="db-req">Восстановление 50</small> Заклинания школы восстановления уровня адепта расходуют вдвое меньше магии.</p></section><section class="db-tal" id="obereg-poglotitel" style="--d:1"><h3>Оберег-поглотитель</h3><p class="db-note">после «Новичок школы восстановления»</p><p><small class="db-req">Восстановление 60</small> Обереги при ударе по ним заклинаниями подпитывают вашу магию.</p></section><section class="db-tal" id="nekromag" style="--d:2"><h3>Некромаг</h3><p class="db-note">после «Регенерация»</p><p><small class="db-req">Восстановление 70</small> Все заклинания более эффективны против нежити.</p></section><section class="db-tal" id="peredyshka" style="--d:1"><h3>Передышка</h3><p class="db-note">после «Новичок школы восстановления»</p><p><small class="db-req">Восстановление 40</small> Лечебные заклинания также восстанавливают запас сил.</p></section><section class="db-tal" id="begstvo-ot-smerti" style="--d:2"><h3>Бегство от смерти</h3><p class="db-note">после «Восполнение»</p><p><small class="db-req">Восстановление 90</small> Раз в сутки, если ваше здоровье становится ниже 10%, автоматически восстанавливается 250 единиц здоровья.</p></section><section class="db-tal" id="ekspert-shkoly-vosstanovleniya" style="--d:3"><h3>Эксперт школы восстановления</h3><p class="db-note">после «Адепт школы восстановления»</p><p><small class="db-req">Восстановление 75</small> Заклинания школы восстановления уровня эксперта расходуют вдвое меньше магии.</p></section><section class="db-tal" id="master-shkoly-vosstanovleniya" style="--d:4"><h3>Мастер школы восстановления</h3><p class="db-note">после «Эксперт школы восстановления»</p><p><small class="db-req">Восстановление 100</small> Заклинания школы восстановления уровня мастера расходуют вдвое меньше магии.</p></section></template>
