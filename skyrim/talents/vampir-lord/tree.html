star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/vampir-lord/#yadovitye-kogti" data-sub="0" aria-label="Ядовитые когти"><title>Ядовитые когти</title><g transform="translate(453 -247)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a><a class="db-tn" href="/db/skyrim/talents/vampir-lord/#plashch-nochi" data-sub="0" aria-label="Плащ ночи"><title>Плащ ночи</title><g transform="translate(453 -331)"><circle r="30"/><use href="#db-tn-star" x="-28" y="-28" width="56" height="56"/></g></a></g></svg></div></div><template class="db-tree-cards"><section class="db-tal" id="sila-mogily" style="--d:0"><h3>Сила могилы</h3><p>В облике вампира-лорда вы получаете прибавку в 50 ед. к здоровью, магии и запасу сил.</p></section><section class="db-tal" id="trupnoe-proklyate" style="--d:3"><h3>Трупное проклятье</h3><p class="db-note">после «Вызов гаргульи»</p><p>Магия крови: позволяет парализовать противника.</p></section><section class="db-tal" id="vyzov-garguli" style="--d:2"><h3>Вызов гаргульи</h3><p class="db-note">после «Хватка вампира»</p><p>Магия крови: позволяет призвать гаргулью, которая будет сражаться на вашей стороне.</p></section><section class="db-tal" id="khvatka-vampira" style="--d:1"><h3>Хватка вампира</h3><p class="db-note">после «Сила могилы»</p><p>Магия крови: позволяет притянуть существо издалека и придушить его, когда жертва окажется близко.</p></section><section class="db-tal" id="nezemnye-zhelaniya" style="--d:1"><h3>Неземные желания</h3><p class="db-note">после «Сила могилы»</p><p>Применение Сил ночи и Магии крови стоит на 33% меньше. </p></section><section class="db-tal" id="lechenie-krovyu" style="--d:1"><h3>Лечение кровью</h3><p class="db-note">после «Сила могилы»</p><p>Убийство жертвы укусом при проведении силовой атаки полностью восстанавливает ваше здоровье.</p></section><section class="db-tal" id="obnaruzhenie-vsekh-sushchestv" style="--d:1"><h3>Обнаружение всех существ</h3><p class="db-note">после «Сила могилы»</p><p>Сила ночи: Обнаружение всех существ, даже двемерских механизмов.</p></section><section class="db-tal" id="tumannaya-forma" style="--d:2"><h3>Туманная форма</h3><p class="db-note">после «Обнаружение всех существ»</p><p>Сила ночи: Превращение в неуязимое облако тумана, позволяющее восстанавливать здоровье, магию и запас сил.</p></section><section class="db-tal" id="sverkhestestvennye-refleksy" style="--d:3"><h3>Сверхъестественные рефлексы</h3><p class="db-note">после «Туманная форма»</p><p>Сила ночи: Все вокруг замедляется, а вы двигаетесь быстрее.</p></section><section class="db-tal" id="yadovitye-kogti" style="--d:2"><h3>Ядовитые когти</h3><p class="db-note">после «Неземные желания» или «Лечение кровью»</p><p>В ближнем бою вы наносите 20 единиц урона ядом.</p></section><section class="db-tal" id="plashch-nochi" style="--d:3"><h3>Плащ ночи</h3><p class="db-note">после «Ядовитые когти»</p><p>В бою вас окутывает стая летучих мышей, кусающих находящихся поблизости врагов.</p></section></template>
