пеха кражи влияют вес и ценность предмета.</li><li><small class="db-req">Карманные кражи 60</small> Вы получаете бонус 80% к карманным кражам. На вероятность успеха кражи влияют вес и ценность предмета.</li><li><small class="db-req">Карманные кражи 80</small> Вы получаете бонус 100% к карманным кражам. На вероятность успеха кражи влияют вес и ценность предмета.</li></ol></section><section class="db-tal" id="shchipach" style="--d:2"><h3>Щипач</h3><p class="db-note">после «Ночной вор»</p><p><small class="db-req">Карманные кражи 40</small> Карманные кражи становятся на 50% легче.</p></section><section class="db-tal" id="nochnoy-vor" style="--d:1"><h3>Ночной вор</h3><p class="db-note">после «Ловкие пальчики»</p><p><small class="db-req">Карманные кражи 30</small> +25% к вероятности успеха при краже у спящих.</p></section><section class="db-tal" id="nositel-yada" style="--d:2"><h3>Носитель яда</h3><p class="db-note">после «Ночной вор»</p><p><small class="db-req">Карманные кражи 40</small> Вы можете скрытно наносить урон врагам, подбрасывая им яд в карманы.</p></section><section class="db-tal" id="nakladnye-karmany" style="--d:2"><h3>Накладные карманы</h3><p class="db-note">после «Ночной вор»</p><p><small class="db-req">Карманные кражи 50</small> Грузоподъемность увеличивается на 100.</p></section><section class="db-tal" id="dezorientatsiya" style="--d:3"><h3>Дезориентация</h3><p class="db-note">после «Щипач»</p><p><small class="db-req">Карманные кражи 70</small> Вы можете красть экипированное оружие.</p></section><section class="db-tal" id="klyuchnik" style="--d:3"><h3>Ключник</h3><p class="db-note">после «Щипач»</p><p><small class="db-req">Карманные кражи 60</small> Вам почти всегда удается стащить ключ из чужого кармана.</p></section><section class="db-tal" id="fokusnik" style="--d:4"><h3>Фокусник</h3><p class="db-note">после «Дезориентация»</p><p><small class="db-req">Карманные кражи 100</small> Вы можете красть экипированные предметы.</p></section></template>
