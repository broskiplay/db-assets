.</p></section><section class="db-tal" id="alkhimik" style="--d:0"><h3>Алхимик</h3><ol class="db-ranks"><li>Зелья и яды вашего изготовления на 20% сильнее.</li><li><small class="db-req">Алхимия 20</small> Зелья и яды вашего изготовления на 40% сильнее.</li><li><small class="db-req">Алхимия 40</small> Зелья и яды вашего изготовления на 60% сильнее.</li><li><small class="db-req">Алхимия 60</small> Зелья и яды вашего изготовления на 80% сильнее.</li><li><small class="db-req">Алхимия 80</small> Зелья и яды вашего изготовления вдвое сильнее.</li></ol></section><section class="db-tal" id="provizor" style="--d:2"><h3>Провизор</h3><p class="db-note">после «Целитель»</p><p><small class="db-req">Алхимия 30</small> У создаваемых вами зелий положительный эффект дополнительно увеличивается на 25%.</p></section><section class="db-tal" id="otravitel" style="--d:2"><h3>Отравитель</h3><p class="db-note">после «Целитель»</p><p><small class="db-req">Алхимия 30</small> Создаваемые вами яды эффективнее на 25%.</p></section><section class="db-tal" id="eksperimentator" style="--d:3"><h3>Экспериментатор</h3><p class="db-note">после «Провизор»</p><ol class="db-ranks"><li><small class="db-req">Алхимия 50</small> При поедании ингредиента вы узнаете первые два его свойства.</li><li><small class="db-req">Алхимия 70</small> При поедании ингредиента вы узнаете первые три его свойства.</li><li><small class="db-req">Алхимия 90</small> При поедании ингредиента вы узнаете все его свойства.</li></ol></section><section class="db-tal" id="kontsentrirovannyy-yad" style="--d:3"><h3>Концентрированный яд</h3><p class="db-note">после «Отравитель»</p><p><small class="db-req">Алхимия 60</small> Яд, нанесенный на оружие, действует вдвое большее количество ударов.</p></section><section class="db-tal" id="travnik" style="--d:4"><h3>Травник</h3><p class="db-note">после «Концентрированный яд»</p><p><small class="db-req">Алхимия 70</small> Вы получаете с растений по два ингредиента.</p></section><section class="db-tal" id="zmeinaya-krov" style="--d:4"><h3>Змеиная кровь</h3><p class="db-note">после «Экспериментатор» или «Концентрированный яд»</p><p><small class="db-req">Алхимия 80</small> 50% сопротивляемость всем ядам.</p></section><section class="db-tal" id="chistota" style="--d:5"><h3>Чистота</h3><p class="db-note">после «Змеиная кровь»</p><p><small class="db-req">Алхимия 100</small> Создаваемые вами зелья не имеют отрицательных эффектов, а яды - положительных.</p></section></template>
